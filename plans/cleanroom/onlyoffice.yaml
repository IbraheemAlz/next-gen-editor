  # ---- file format & conversion ----
  - key: binary-snapshot-format
    name: Versioned internal binary snapshot
    category: docx-io
    maturity: full
    summary: The editor's native serialization, shared byte-for-byte with the C++ side; versioned with documented per-version default rules so old snapshots load.
    where: [{repo: sdkjs, path: word/Editor/Serialize2.js}, {repo: core, path: OOXML/Binary/Document}]
  - key: docx-regeneration-io
    name: DOCX via full-model regeneration
    category: docx-io
    maturity: full
    summary: Open converts docx fully into the binary model; save regenerates every part from the model. No byte preservation of untouched parts; unmodeled constructs can be lost.
    where: [{repo: core, path: OOXML/Binary/Document/BinWriter}, {repo: core, path: OOXML/Binary/Document/BinReader}]
    notes: Contrast with our sibling-byte-preserving strategy — this is their main fidelity trade-off.
  - key: ooxml-dom
    name: OOXML DOM libraries (C++)
    category: docx-io
    maturity: full
    summary: Typed C++ classes for the docx package and document.xml content (paragraphs, runs, tables, sections, sdt, fields, VML, math), used by all converters.
    where: [{repo: core, path: OOXML/DocxFormat}, {repo: core, path: OOXML/DocxFormat/Logic}]
  - key: x2t-hub
    name: x2t hub-and-spoke conversion
    category: conversion
    maturity: full
    summary: Every format converts to/from the internal binary hub (or direct docx<->odt/rtf paths); XML job tickets drive the tool; the format matrix is centrally declared.
    where: [{repo: core, path: X2tConverter/src}, {repo: core, path: Common}]
  - key: legacy-formats
    name: Legacy/interchange format converters
    category: conversion
    maturity: full
    summary: Binary .doc, RTF, ODF (odt), HTML, EPUB, FB2, HWP, and more, all via the conversion hub.
    where: [{repo: core, path: MsBinaryFile/DocFile}, {repo: core, path: RtfFile}, {repo: core, path: OdfFile}, {repo: core, path: HtmlFile2}, {repo: core, path: EpubFile}]
  - key: pdf-to-docx
    name: PDF-to-DOCX reconstruction
    category: conversion
    maturity: partial
    summary: Rendered PDF content reconstructed into editable docx (text/paragraph recovery from page geometry).
    where: [{repo: core, path: DocxRenderer}, {repo: core, path: PdfFile}]
  - key: encrypted-files
    name: Password-protected file handling
    category: conversion
    maturity: full
    summary: Standard/agile OOXML encryption read/write at the conversion boundary.
    where: [{repo: core, path: OfficeCryptReader}]
  - key: font-discovery
    name: System font discovery + font list generation
    category: fonts
    maturity: full
    summary: Scans font directories, resolves family/style names (incl. non-Latin names), and generates the font list + thumbnails the editors consume.
    where: [{repo: core, path: DesktopEditor/fontengine}, {repo: core, path: DesktopEditor/AllFontsGen}]

  # ---- stability ----
  - key: autosave-change-stream
    name: Autosave as change streaming
    category: stability
    maturity: full
    summary: Idle/interval autosave ships change points, not snapshots; the server rebuilds state as snapshot + changes, which is also the crash-recovery path.
    where: [{repo: sdkjs, path: word/api.js}, {repo: sdkjs, path: common/docscoapi.js}]
  - key: error-codes
    name: Enumerated error surface
    category: stability
    maturity: full
    summary: Enumerated open/save/conversion/rights error codes surfaced to the shell through API events; the shell decides on reload or limited mode.
    where: [{repo: sdkjs, path: common/errorCodes.js}]
