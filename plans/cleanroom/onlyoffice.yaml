features:
  # ---- layout & pagination ----
  - key: incremental-relayout-tiers
    name: Three-tier incremental relayout
    category: layout
    maturity: full
    summary: Run-range fast patch, single-paragraph fast relayout with invariant verification, and full page-anchored reflow as fallback; fast tiers self-verify bounds/end-state and demote on mismatch.
    where:
      - {repo: sdkjs, path: word/Editor/Paragraph_Recalculate.js}
      - {repo: sdkjs, path: word/Editor/Document.js}
    notes: The fast tiers skip footnote renegotiation and reference-mark renumbering entirely; correctness relies on verify-then-demote, not on re-negotiating.
  - key: timer-sliced-pagination
    name: Interruptible timer-sliced pagination
    category: layout
    maturity: full
    summary: Full reflow runs page-by-page on short timers with a small synchronous head start, repainting pages as they finish; new edits cancel and restart from the earlier dirty point.
    where: [{repo: sdkjs, path: word/Editor/Document.js}]
  - key: change-log-dirty-tracking
    name: Undo log as layout dirty tracker
    category: layout
    maturity: full
    summary: Recalculation derives its restart point from unprocessed change objects (same objects that drive undo and collab), folding in header/footer usage pages and keep-with-next backup.
    where: [{repo: sdkjs, path: word/Editor/History.js}, {repo: sdkjs, path: word/Editor/DocumentChanges.js}]
  - key: per-element-page-fragments
    name: Per-element per-page layout fragments
    category: layout
    maturity: full
    summary: Elements own arrays of per-page layout fragments (lines/rows), letting pagination resume mid-document and fast tiers patch in place.
    where: [{repo: sdkjs, path: word/Editor/Paragraph.js}, {repo: sdkjs, path: word/Editor/Table.js}]
  - key: line-as-ranges
    name: Line model as horizontal range segments
    category: layout
    maturity: full
    summary: Each line is a set of x-intervals; float wrap cutouts and column layout both reduce to range segmentation before line filling. RTL paragraphs enumerate wrap-cutout ranges in reverse so lines fill right-to-left.
    where: [{repo: sdkjs, path: word/Editor/Paragraph_Recalculate.js}, {repo: sdkjs, path: word/Editor/FlowObjects.js}]
  - key: speculative-placement-rollback
    name: Speculative placement with layout snapshots
    category: layout
    maturity: full
    summary: Elements snapshot/restore layout state so pagination can try a placement and roll back when footnote space or keep rules reject it; element layout returns explicit control-flow result flags; table rows also snapshot/roll back footnote controller state.
    where: [{repo: sdkjs, path: word/Editor/Paragraph_Recalculate.js}, {repo: sdkjs, path: word/Editor/Table/TableRecalculate.js}]
  - key: keep-rules-widow-orphan
    name: Keep-next/keep-lines/widow-orphan control
    category: layout
    maturity: full
    summary: Full support for paragraph pagination constraints including backing the reflow start point over keep-with-next chains.
    where: [{repo: sdkjs, path: word/Editor/Paragraph_Recalculate.js}]
  - key: read-mode-layout-policy
    name: Swappable layout policies (print vs reflow view)
    category: layout
    maturity: full
    summary: Print layout and a reflowable read mode are strategy objects over the same model; pagination queries the policy for page frames.
    where: [{repo: sdkjs, path: word/Editor/Layout}]

  # ---- text pipeline ----
  - key: wasm-font-engine
    name: FreeType+HarfBuzz WASM font engine
    category: text-pipeline
    maturity: full
    summary: All measurement/shaping/rastering goes through a WASM build of the C++ font stack (stock upstream HarfBuzz pinned to a commit, FreeType-glue patch only), giving identical metrics across browsers and on the headless server renderer.
    where: [{repo: sdkjs, path: common/libfont}, {repo: core, path: DesktopEditor/fontengine}, {repo: core, path: Common/3dParty/harfbuzz}]
  - key: grapheme-interning
    name: Global shaped-grapheme interning
    category: text-pipeline
    maturity: full
    summary: Shaped clusters (font + glyphs + advances + offsets) are deduplicated in a global table addressed by integer ids; runs store grapheme ids plus widths; monotone-grapheme clustering keeps base+marks in one cluster whose width divides evenly across its codepoints.
    where: [{repo: sdkjs, path: common/libfont/grapheme.js}, {repo: sdkjs, path: common/libfont/textshaper.js}, {repo: sdkjs, path: common/libfont/engine.js}]
  - key: reference-size-shaping
    name: Shape once at reference size, scale linearly
    category: text-pipeline
    maturity: full
    summary: Shaping and metrics are computed at one large fixed size and scaled to actual run sizes/zoom, so caches are size-independent.
    where: [{repo: sdkjs, path: common/libfont/grapheme.js}]
  - key: streaming-bidi
    name: Streaming pragmatic BiDi reorder
    category: text-pipeline
    maturity: partial
    summary: >
      Classification is full UAX #9 (per-codepoint table generated from
      Unicode data incl. explicit/override/isolate codes, plus bracket-pair
      data), but resolution is a streaming subset: strong/weak/neutral
      buffers with flush rules, neutrals to the paragraph base direction,
      digit islands LTR inside RTL. No embedding-level stack — explicit
      directional codes are classified but never interpreted; bracket data
      serves only draw-time mirrored-glyph substitution (not rule N0). One
      reorderer is replayed by layout, painting, decorations, selection,
      caret geometry, hit-testing, and list numbers — consistency by
      construction.
    where:
      - {repo: sdkjs, path: word/Editor/Paragraph/bidi-flow.js}
      - {repo: sdkjs, path: common/bidi}
      - {repo: sdkjs, path: word/Editor/Paragraph/recalc/align-recalc-state.js}
      - {repo: sdkjs, path: word/Editor/Paragraph/position-calculator.js}
      - {repo: sdkjs, path: word/Editor/Paragraph/search-position-by-coords.js}
      - {repo: sdkjs, path: word/Editor/Paragraph/draw-selection.js}
      - {repo: sdkjs, path: word/Editor/Paragraph/draw}
    notes: >
      No first-strong auto paragraph direction (explicit toggle only); a
      per-character RTL flag is stored but never read; typing never stamps
      the run-level <w:rtl> property (in-tree to-do). A full UAX #9 engine
      exists in the C++ tree only inside unused vendored ICU.
  - key: rtl-paragraph-editing
    name: RTL paragraph editing & mirrored geometry
    category: text-pipeline
    maturity: full
    summary: >
      Paragraph direction from compiled <w:bidi> (defaults/style/direct);
      logical-order arrow movement with a paragraph-level left/right key
      flip; as-you-type caret pinning at direction boundaries; cluster-aware
      caret (never inside base+mark pairs); epsilon-merged visual-order
      selection rects (discontinuous BiDi selection for free); mirrored
      indents, alignment, trailing-space overhang, tabs resolved in a
      reflected coordinate space, borders/shading, click-and-type,
      formatting-mark glyphs, ruler with right origin, RTL list-number
      anchoring; RTL section gutter placement.
    where:
      - {repo: sdkjs, path: word/Editor/Paragraph_Recalculate.js}
      - {repo: sdkjs, path: word/Editor/Paragraph.js}
      - {repo: sdkjs, path: word/Editor/Document.js}
      - {repo: sdkjs, path: word/Editor/sections/sect-pr.js}
      - {repo: sdkjs, path: word/Editor/Numbering/Num.js}
      - {repo: sdkjs, path: word/Drawing/Rulers.js}
    notes: >
      Document paragraphs store logical (OOXML) alignment with left/right
      swapped to visual terms at the UI boundary; shape text stores visual
      alignment and swaps at toggle/recalc — two coexisting conventions.
      Section-level <w:bidi> (RTL column fill order) is conversion-layer
      only: the editor always fills columns left-to-right. HTML clipboard
      does not carry direction, so RTL-ness survives only the internal
      binary flavor.
  - key: kashida-justification
    name: Kashida/tatweel justification
    category: text-pipeline
    maturity: absent
    summary: >
      No kashida anywhere: justify distributes leftover width evenly across
      inter-word spaces (trailing spaces excluded); the per-letter channel
      exists only for the no-spaces CJK case. The WASM shaper has no
      elongation hooks. Worse, the OOXML kashida jc values fall through the
      docx-to-internal-binary conversion's default branch to LEFT alignment
      — a kashida-justified document opens start-aligned, not even
      justified, and loses the setting on save; distribute/thaiDistribute
      degrade to plain justify. The RTF/.doc/ODF layers carry the values as
      inert format data only.
    where:
      - {repo: sdkjs, path: word/Editor/Paragraph_Recalculate.js}
      - {repo: core, path: OOXML/Common/SimpleTypes_Word.cpp}
      - {repo: core, path: OOXML/Binary/Document/BinWriter/BinaryWriterD.cpp}
      - {repo: core, path: RtfFile/OOXml/Reader/OOXParagraphElementReaders.cpp}
  - key: arabic-shaping
    name: Arabic/complex-script shaping behavior
    category: text-pipeline
    maturity: full
    summary: >
      Joining, contextual forms, ligatures, and mark placement are stock
      HarfBuzz output with FreeType metrics. Shaping buffer flushes on
      space, script/direction/font change, shaping-relevant property change,
      inline-container boundary, and a max length; the shaping-context
      comparison ignores color/underline/highlight/language so those changes
      never break joining mid-word. Emergency over-wide-word breaks re-shape
      each candidate sub-range so fragments keep correct contextual forms;
      marks never separate from bases.
    where:
      - {repo: sdkjs, path: word/Editor/Paragraph/TextShaper.js}
      - {repo: sdkjs, path: common/libfont/textshaper.js}
      - {repo: core, path: DesktopEditor/fontengine/TextShaper.cpp}
    notes: >
      Shaping language hard-coded to English (locl never fires). A
      hard-coded U+060C..U+074A force-Arabic script override (public-bug
      workaround, in-tree to-do to replace with a real bidi algorithm)
      mis-tags the Syriac block; duplicated in the spreadsheet cell
      renderer. HarfBuzz unsafe-to-break flags exported but unused (to-do).
      Suite-consistent: the spreadsheet cell editor shapes through the same
      path.
  - key: script-font-fallback
    name: Font slots + script itemization + fallback
    category: text-pipeline
    maturity: full
    summary: >
      Three mechanisms: (a) an OOXML font-slot classifier
      (ascii/hAnsi/eastAsia per the public ECMA TC45 DR 09-0040 disposition,
      extended empirically) with the cs slot chosen only when the run
      carries the CS or RTL flag — Arabic/Hebrew/Syriac ranges classify to
      the ascii slot; (b) per-codepoint cmap-coverage substitution among
      loaded fonts, migrating a buffered word wholesale when it fits the
      substitute; (c) a server-generated Unicode-range-to-font table whose
      hand-ordered priority list contains no dedicated Arabic font.
    where:
      - {repo: sdkjs, path: word/Editor/Paragraph/Run/FontClassification.js}
      - {repo: sdkjs, path: word/Editor/Paragraph/Run/FontCalculator.js}
      - {repo: sdkjs, path: common/libfont/character.js}
      - {repo: sdkjs, path: common/libfont/textmeasurer.js}
      - {repo: core, path: DesktopEditor/fontengine/ApplicationFontsWorker.cpp}
    notes: A mid-word fallback font switch still flushes the shaping segment, so joining breaks across a fallback boundary. Spaces are always measured in the ascii-slot font.
  - key: auto-hyphenation
    name: Automatic hyphenation
    category: text-pipeline
    maturity: full
    summary: Pattern-based per-language hyphenation with lazily loaded language data, applied during line breaking when enabled (no patterns for Arabic, correctly).
    where: [{repo: sdkjs, path: word/Editor/Paragraph/TextHyphenator.js}, {repo: sdkjs, path: common/api/auto-hyphenation-settings.js}]
  - key: ligature-control
    name: OpenType feature control (ligatures + kern)
    category: text-pipeline
    maturity: partial
    summary: >
      Exactly five user-controllable features reach the shaping call — the
      four ligature classes (mirroring the w14:ligatures value set) plus
      kerning — all passed explicitly, zeroed when unset. Kerning is off
      everywhere (no editor run property requests it); contextual ligatures
      off by default; standard ligatures force-enabled for Arabic/Syriac
      regardless of the run setting; nonzero letter-spacing disables all
      ligatures on the run; w14:cntxtAlts round-trips in conversion but is
      never applied. Everything else (joining forms, rlig, calt, mark,
      mkmk, ccmp) rides HarfBuzz defaults.
    where: [{repo: sdkjs, path: word/Editor/Paragraph/TextShaper.js}, {repo: core, path: DesktopEditor/fontengine/TextShaper.cpp}]
  - key: numeral-display
    name: Numeral display setting (western/hindi)
    category: text-pipeline
    maturity: partial
    summary: Document-level numeral option matching Word's — western and hindi implemented as display-time substitution of ASCII digits with Arabic-Indic digits (model keeps ASCII); the context value is defined in the enum but explicitly rejected. PDF form fields have a separate per-field variant.
    where: [{repo: sdkjs, path: word/api.js}, {repo: sdkjs, path: word/Editor/Paragraph/TextShaper.js}]

  # ---- tables ----
  - key: table-grid-autofit
    name: Table grid normalization + AutoFit
    category: tables
    maturity: full
    summary: >
      A declared-grid reconciliation pass always runs (explicit cell widths
      widen grid columns, monotonic widening walk over rows, proportional
      rescale to any declared table width) and alone defines fixed layout;
      the content-based min/max AutoFit pass runs only in autofit mode, with
      the TOP-LEVEL ancestor table's mode governing nested tables. Explicit
      cell widths replace a column's max-content; a min-ignoring-preferred
      tier drives overflow fallbacks; multi-span distribution is
      deliberately order-dependent; min/max clamp at Word's documented
      22-inch cap. Recognizably the CSS2 auto-table algorithm extended with
      Word's preferred-width tiers.
    where: [{repo: sdkjs, path: word/Editor/Table/TableRecalculate.js}, {repo: sdkjs, path: word/Editor/Table.js}]
    notes: No Word-style "AutoFit to Contents/Window" command — only the fixed/autofit layout property plus distribute-rows/columns. Percent base is the narrowest section column in multi-column sections; nested tables use the parent cell content width.
  - key: table-row-splitting
    name: Row splitting across pages
    category: tables
    maturity: full
    summary: Rows split across page boundaries by splitting each cell's content with continuation state (only when every participating merge-start, non-vertical-text cell places some content — otherwise all cells restart on the next page); vertically merged cells re-lay at the break; repeated header rows re-laid from per-page clones (inline top-level tables only, trimmed of merge-crossing rows, skipped when they don't fit).
    where: [{repo: sdkjs, path: word/Editor/Table/TableRecalculate.js}, {repo: sdkjs, path: word/Editor/Table/TableRow.js}]
    notes: The OOXML per-row can't-split flag (<w:cantSplit>) is stored and round-tripped but NOT consumed by layout, and no UI/API sets it — rows always split by content; only exact/at-least-height rows move to the next page whole. Rotated-text cells never split.
  - key: table-border-conflicts
    name: Border conflict resolution
    category: tables
    maturity: full
    summary: In the collapsed model an explicitly set cell border beats the table border, a none border loses to any set border, ties resolve by the ECMA-376 comparison (wider wins, then weighted-brightness cascade); results stored per cell edge as per-grid-segment arrays and inset into content metrics before layout. Cell-spacing tables have NO conflict pass — each cell draws its own borders plus the table outer border.
    where: [{repo: sdkjs, path: word/Editor/Table/TableRecalculate.js}, {repo: sdkjs, path: word/Editor/Table.js}]
  - key: table-styles-conditional
    name: Table styles with conditional bands
    category: tables
    maturity: full
    summary: All 13 OOXML conditional slots layered per the spec order under the six table-look flags, band membership by floor-division of band size, with Word-compat quirks (row-band counting starts after the header row only when the first-row flag is on; the column shift requires a non-empty first-column conditional style; first-row formatting extends to header-flagged rows; cell text direction never comes from the style; <w:cnfStyle> transported but never consumed — conditions recomputed from live position).
    where: [{repo: sdkjs, path: word/Editor/Styles.js}, {repo: sdkjs, path: word/Editor/Table/TableLook.js}, {repo: sdkjs, path: word/Editor/Table/TableCell.js}]
  - key: floating-tables
    name: Floating (positioned) tables
    category: tables
    maturity: full
    summary: Anchored H/V positioning reusing the drawing anchor machinery, rectangular both-sides wrap only with distance-to-text, overlap avoidance honoring <w:tblOverlap>, Word-parity quirks replicated (table indent added to floating X; header/footer page- or margin-anchored floating tables get an unbounded bottom); multi-page floating tables flow but never repeat header rows.
    where: [{repo: sdkjs, path: word/Editor/Table.js}, {repo: sdkjs, path: word/Editor/FlowObjects.js}, {repo: sdkjs, path: word/Editor/Document.js}, {repo: sdkjs, path: word/Editor/Paragraph/ParaDrawing.js}]
  - key: cell-vertical-text
    name: Vertical cell text direction
    category: tables
    maturity: full
    summary: The two 90-degree rotations of the five OOXML cell text directions are treated as vertical; rotated cells measure min/max in rotated space, lay out after row height is known, never split, and follow a compat-mode fork for overflow alignment.
    where: [{repo: sdkjs, path: word/Editor/Table/TableCell.js}]
  - key: table-formulas
    name: Table formula fields
    category: tables
    maturity: full
    summary: Expression-field parser with the complete Word-standard 18-function library, bookmark and table cell-name/cell-range arguments, and numeric-picture result formatting, evaluated on field update.
    where: [{repo: sdkjs, path: word/Editor/Paragraph/FormulaParser.js}]
  - key: rtl-tables
    name: RTL tables (bidiVisual)
    category: tables
    maturity: absent
    summary: No visual column mirroring for RTL tables in the word editor; the table layout module never consults paragraph/section direction at all (paragraph-level RTL inside cells works, table geometry is LTR-only).
    where:
      - {repo: sdkjs, path: word/Editor/Table.js}
      - {repo: sdkjs, path: word/Editor/Serialize2.js}
      - {repo: core, path: OOXML/DocxFormat/Logic/TableProperty.cpp}
      - {repo: core, path: OOXML/Binary/Document/BinWriter/BinReaderWriterDefines.h}
    notes: The C++ conversion core fully round-trips <w:bidiVisual> (docx DOM read/write with revision merge, .doc/RTF/ODF-import mappings, and a dedicated binary-format record), but the JS editor's binary vocabulary stops one record short of it — unknown-record skipping silently drops the property on any editor open/save cycle. Pure C++ format-to-format conversion preserves it.

  # ---- sections, pages, headers/footers ----
  - key: sections-model
    name: Section model with all break types
    category: sections
    maturity: full
    summary: Section properties attach to paragraphs and aggregate into a section index; next-page/continuous/even/odd/column breaks; per-section page size, margins, gutter (top setting wins, else right when rtlGutter else left, mirror-margins swapping on odd pages), page borders, title page.
    where: [{repo: sdkjs, path: word/Editor/sections}, {repo: sdkjs, path: word/Editor/document}]
    notes: Section-level <w:bidi> (RTL column fill order) is conversion-layer-only — the editor always fills columns left-to-right.
  - key: multi-columns
    name: Multi-column sections
    category: sections
    maturity: full
    summary: Equal and unequal column widths with separators and column breaks; continuous section balancing.
    where: [{repo: sdkjs, path: word/Editor/sections/section-columns.js}, {repo: sdkjs, path: word/Editor/document/document-page-column.js}]
  - key: headers-footers
    name: Headers/footers with inheritance
    category: sections
    maturity: full
    summary: First/even/odd variants, link-to-previous as slot absence, watermarks, full document content inside; a dedicated re-layout pass updates page-count-dependent content via a per-header registry populated during layout.
    where: [{repo: sdkjs, path: word/Editor/HeaderFooter.js}, {repo: sdkjs, path: word/Editor/HeaderFooterController.js}]
  - key: line-numbering
    name: Line numbering
    category: sections
    maturity: full
    summary: Per-section line numbering with restart modes and count-by, painted in the margin.
    where: [{repo: sdkjs, path: word/Editor/sections/line-numbering.js}]

  # ---- fields, TOC, notes ----
  - key: complex-fields
    name: Complex fields (begin/separate/end)
    category: fields
    maturity: full
    summary: >
      Sentinel run items matching the OOXML field-char model; one
      instruction parser with a single keyword dispatch producing typed
      fields for PAGE, PAGEREF, TOC, REF, NOTEREF, NUMPAGES, HYPERLINK,
      SEQ, STYLEREF, TIME, DATE, ADDIN, MERGEFIELD, FORMTEXT, FORMCHECKBOX,
      and leading-equals formulas; unknown keywords fall back to
      implicit-REF parsing; a layout-time field stack tracks nesting.
    where:
      - {repo: sdkjs, path: word/Editor/Paragraph/ComplexField.js}
      - {repo: sdkjs, path: word/Editor/Paragraph/ComplexFieldInstruction.js}
      - {repo: sdkjs, path: word/Editor/Paragraph/ComplexFields}
      - {repo: sdkjs, path: word/Editor/Field.js}
    notes: >
      ASK is effectively unreachable — the keyword dispatch matches a
      misspelled token, so real ASK instructions parse as REF (live bug).
      FORMDROPDOWN is never typed by the parser (its w:ffData dropdown
      payload is modeled and round-tripped, but the runtime treats the
      instruction as REF). Simple fields (w:fldSimple) load into a distinct
      inline wrapper representation (not converted to complex), with
      PAGE/NUMPAGES special-cased into dedicated run items, header/footer
      PAGE/NUMPAGES wrappers converted to complex on open, and untypeable
      simple fields unwrapped to plain content. Word's long tail
      (SECTIONPAGES, AUTONUM, DOCPROPERTY, INCLUDETEXT, INDEX/XE, etc.) is
      not modeled.
  - key: page-number-fields
    name: PAGE/NUMPAGES with post-pass update
    category: fields
    maturity: full
    summary: Page numbers paint from layout position; total-page counts update via a dedicated header/footer re-layout pass after pagination stabilizes.
    where: [{repo: sdkjs, path: word/Editor/Paragraph/RunContent/PageNum.js}, {repo: sdkjs, path: word/Editor/Paragraph/RunContent/PagesCount.js}]
  - key: toc
    name: Table of contents
    category: fields
    maturity: partial
    summary: TOC field collects heading-style / explicit-style-list / SEQ-caption paragraphs, regenerates its result content with page numbers, hyperlinks, and leader tabs; table-of-figures via SEQ.
    where: [{repo: sdkjs, path: word/Editor/Paragraph/ComplexFieldInstruction.js}, {repo: sdkjs, path: word/Editor/DocumentOutline.js}]
    notes: Not parsed (in-code to-do) — bookmark scope (\b), sequence separators (\d), TC-entry collection (\f, \l), sequence-prefixed page numbers (\s), web leader hiding (\z), applied outline level (\u); TC-entry-based TOCs unsupported.
  - key: footnotes
    name: Footnotes with space negotiation
    category: notes
    maturity: full
    summary: Per-line reservation of page-bottom space, per-page/per-column controller state, splitting across pages with separator and continuation-separator stories, numbering restart modes and custom marks, position options with a replicated Word quirk (section/document-end values act as beneath-text, everything else as page-bottom).
    where:
      - {repo: sdkjs, path: word/Editor/Footnotes.js}
      - {repo: sdkjs, path: word/Editor/Paragraph_Recalculate.js}
      - {repo: sdkjs, path: word/Editor/FootEndNote.js}
      - {repo: sdkjs, path: word/Editor/Paragraph/RunContent/FootnoteReference.js}
      - {repo: sdkjs, path: word/Editor/Table/TableRecalculate.js}
    notes: >
      The continuation-notice story is model-only — a serialized slot with
      per-column snapshot space, but no layout or paint path ever renders
      it. Mark formats limited to decimal/upper-lower roman/upper-lower
      letter with decimal fallback (Chicago symbol marks not rendered for
      footnote marks). Custom start numbers only apply in continuous
      numbering mode. Table rows snapshot/roll back footnote state; fast
      relayout tiers skip renegotiation entirely (verify-then-demote).
  - key: endnotes
    name: Endnotes
    category: notes
    maturity: full
    summary: Registered per line during layout but reserving no page space; flowed as a trailing story after the last body element at section/document end (document-end endnotes placed only on the final pass) with their own separator/continuation-separator stories.
    where: [{repo: sdkjs, path: word/Editor/Endnotes.js}, {repo: sdkjs, path: word/Editor/Paragraph/RunContent/EndnoteReference.js}]

  # ---- review, comments, collaboration ----
  - key: track-changes
    name: Track changes incl. move detection
    category: review
    maturity: full
    summary: Insert/delete/format/property revisions with per-user attribution, paired move-from/move-to ranges, accept/reject granularity, and a document-order change navigator.
    where: [{repo: sdkjs, path: word/Editor/revisions}, {repo: sdkjs, path: word/Editor/RevisionsChange.js}]
  - key: comments
    name: Ranged comments
    category: review
    maturity: full
    summary: Paired range markers survive edits; replies, resolve state, quote capture, comments in headers and text boxes.
    where: [{repo: sdkjs, path: word/Editor/Comments.js}]
  - key: compare-combine
    name: Document compare and combine
    category: review
    maturity: full
    summary: Client-side diff of two loaded models emitting tracked changes attributed to the compared author; combine merges two revision sets.
    where: [{repo: sdkjs, path: word/Editor/Comparison.js}, {repo: sdkjs, path: word/Editor/Merge.js}]
  - key: collab-change-streaming
    name: Change-based collaboration (fast + strict modes)
    category: collaboration
    maturity: full
    summary: Object-id-addressed invertible change objects stream through the document server; strict mode uses object-level locks with merge-on-save, fast mode streams live.
    where:
      - {repo: sdkjs, path: common/CollaborativeEditingBase.js}
      - {repo: sdkjs, path: word/Editor/CollaborativeEditing.js}
      - {repo: sdkjs, path: common/docscoapi.js}
  - key: collab-undo
    name: Collaborative undo + deleted-text recovery
    category: collaboration
    maturity: full
    summary: Undo of own changes by inversion with content-position fixups against later foreign changes; a recovery layer can restore text deleted by another user.
    where: [{repo: sdkjs, path: common/collaborativeHistory.js}, {repo: sdkjs, path: common/collaboration/deleted-text-recovery.js}]
  - key: version-history
    name: Server version history navigation
    category: collaboration
    maturity: full
    summary: Replays stored change streams over base snapshots to show any version with per-author change coloring.
    where: [{repo: sdkjs, path: common/versionHistory.js}]
  - key: undo-change-objects
    name: Invertible typed change objects
    category: undo
    maturity: full
    summary: Every mutation is a typed change with its own undo/redo/serialize; grouped into user-action points; temporary points for IME; same objects feed collab and layout dirtying.
    where: [{repo: sdkjs, path: word/Editor/History.js}, {repo: sdkjs, path: word/Editor/DocumentContentChanges.js}, {repo: sdkjs, path: common/HistoryCommon.js}]

  # ---- drawings, charts, math ----
  - key: floating-objects-wrap
    name: Floating drawings with wrap polygons
    category: drawings
    maturity: full
    summary: All OOXML wrap types; square wrap from bounds, tight/through from computed (and user-editable) wrap polygons contributing per-line x-interval cutouts.
    where: [{repo: sdkjs, path: word/Editor/FlowObjects.js}, {repo: sdkjs, path: word/Editor/GraphicObjects}]
  - key: drawingml-shapes
    name: Full DrawingML shape model
    category: drawings
    maturity: full
    summary: Preset/custom geometry, fills, outlines, groups, connectors, text bodies with autofit; shared across all suite editors.
    where: [{repo: sdkjs, path: common/Drawings/Format}]
  - key: charts
    name: Native canvas chart engine
    category: charts
    maturity: full
    summary: All major chart families incl. newer chart types drawn from the chart part model; data edited via an embedded spreadsheet.
    where: [{repo: sdkjs, path: common/Charts}]
  - key: smartart
    name: SmartArt rendering/editing
    category: drawings
    maturity: partial
    summary: SmartArt laid out from its definition data and editable at shape level; not full diagram re-layout semantics.
    where: [{repo: sdkjs, path: common/SmartArts}]
  - key: math-omml
    name: OMML math layout + linear input
    category: math
    maturity: full
    summary: Recursive OMML content layout inside paragraph lines; UnicodeMath and LaTeX input parsers; math autocorrect; legacy binary equations converted to OMML at import by the C++ core. In BiDi context math is an opaque LTR island.
    where: [{repo: sdkjs, path: word/Math}, {repo: core, path: OOXML/Binary/MathEquation}]

  # ---- forms, content controls, mail merge ----
  - key: content-controls
    name: Structured document tags (inline + block)
    category: forms
    maturity: full
    summary: Rich/plain text, checkbox, combo/dropdown, date, picture controls with locking and placeholder handling.
    where: [{repo: sdkjs, path: word/Editor/StructuredDocumentTags}]
  - key: fixed-forms
    name: Fillable forms layer (oform)
    category: forms
    maturity: full
    summary: Fixed-size fields, comb text, keys/roles/required flags, a forms manager, form-filling mode with restricted undo, and PDF-form export via the conversion pipeline.
    where: [{repo: sdkjs, path: word/Editor/StructuredDocumentTags/FormsManager.js}, {repo: core, path: X2tConverter/src}]
  - key: mail-merge
    name: Mail merge
    category: mail-merge
    maturity: full
    summary: MERGEFIELD registry, spreadsheet data source, record preview, server-side merged output to docx/pdf/email. MERGEFIELD parsing takes the field name only (before/after-text switches unparsed).
    where: [{repo: sdkjs, path: word/Editor/Document.js}, {repo: sdkjs, path: word/Editor/Paragraph/ComplexFields/MergeField.js}]

  # ---- input, clipboard, search, spelling ----
  - key: hidden-input-ime
    name: Hidden input element + IME composition
    category: input
    maturity: full
    summary: Hidden textarea/contenteditable at the caret captures keys and composition; composition text inserted provisionally and finalized on composition end; platform quirks special-cased.
    where: [{repo: sdkjs, path: common/text_input.js}, {repo: sdkjs, path: word/Editor/document-composite-input.js}]
  - key: clipboard-multiflavor
    name: Multi-flavor clipboard
    category: clipboard
    maturity: full
    summary: Internal binary flavor for lossless intra-suite paste, generated HTML for external apps, plain text; large HTML import/normalization path for pastes from Word/Google Docs.
    where: [{repo: sdkjs, path: common/wordcopypaste.js}, {repo: sdkjs, path: common/clipboard_base.js}]
    notes: The HTML pipeline (both directions) has no dir/direction handling — RTL-ness does not survive HTML interchange; only the internal binary flavor preserves it.
  - key: find-replace
    name: Find/replace across stories
    category: search
    maturity: full
    summary: Document-order search spanning body, headers/footers, footnotes, text boxes with ranged matches that survive relayout; highlight-all.
    where: [{repo: sdkjs, path: word/Editor/Search}]
  - key: spellcheck-wasm
    name: Hunspell WASM spellcheck in a worker
    category: spellcheck
    maturity: full
    summary: Per-paragraph incremental collection of dirty text, idle-batched checking in a worker, wavy underline painting, suggestions; Arabic dictionary covering sixteen dialects since v9.0.
    where: [{repo: sdkjs, path: common/spell}, {repo: sdkjs, path: word/Editor/SpellChecker}]
  - key: autocorrect
    name: As-you-type autocorrect
    category: input
    maturity: full
    summary: Capitalization, hyperlink detection, smart quotes, list detection (recognizing Arabic-Indic digits), math autocorrect, exception lists — applied against the recent-change window.
    where: [{repo: sdkjs, path: word/Editor/Paragraph/Run/RunAutoCorrect.js}, {repo: sdkjs, path: common/api/autoCorrectSettings.js}]

  # ---- rendering & view ----
  - key: canvas-mm-graphics
    name: mm-unit abstract 2D graphics layer
    category: rendering
    maturity: full
    summary: All painting goes through an abstract interface in document units with screen-canvas, recording (metafile), thumbnail, and native implementations.
    where: [{repo: sdkjs, path: word/Drawing/Graphics.js}, {repo: sdkjs, path: common/Drawings/Metafile.js}]
  - key: page-bitmap-cache
    name: Page bitmap cache
    category: rendering
    maturity: full
    summary: Rendered page images cached with lock/unused counters; scroll re-blits, only dirty pages repaint; selection/caret on a separate overlay canvas.
    where: [{repo: sdkjs, path: word/Drawing/cachemanager.js}, {repo: sdkjs, path: common/Overlay.js}]
  - key: print-command-stream
    name: Print/PDF via recorded command stream
    category: print
    maturity: full
    summary: The recording graphics backend captures a command stream replayed for print and server-side PDF generation, so export and screen cannot diverge.
    where: [{repo: sdkjs, path: common/Drawings/Metafile.js}, {repo: core, path: DesktopEditor/doctrenderer}]
  - key: rulers-ui
    name: Canvas rulers with drag interactions
    category: rendering
    maturity: full
    summary: Horizontal/vertical rulers with indent/tab/margin/column drag handles drawn and hit-tested in the view layer; RTL mode moves the zero origin to the right margin and converts drags as distances from it.
    where: [{repo: sdkjs, path: word/Drawing/Rulers.js}]

  # ---- styles & numbering ----
  - key: compiled-style-cache
    name: Compiled-property caching + interning
    category: styles
    maturity: full
    summary: Effective formatting compiled lazily (defaults, style chain, direct) and cached; formatting objects deduplicated via a ref-counted intern table keyed by serialized bytes.
    where: [{repo: sdkjs, path: word/Editor/Styles.js}, {repo: sdkjs, path: word/Editor/Styles/style-cache.js}]
  - key: numbering
    name: Multilevel numbering
    category: numbering
    maturity: full
    summary: Abstract definitions plus per-list overrides, restart/legal numbering, RTL-aware number rendering, incremental collection of numbered paragraphs; Arabic alphabetic/abjad and two Hebrew letter formats genuinely generated.
    where: [{repo: sdkjs, path: word/Editor/Numbering}, {repo: sdkjs, path: word/Editor/Numbering/NumberingCommon.js}]
    notes: List-number text is painted codepoint-by-codepoint through the streaming reorderer (bracket-mirrored but unshaped) — multi-letter abjad values would render unjoined.

  # ---- protection, a11y, plugins ----
  - key: document-protection
    name: Protection modes + ranged permissions
    category: protection
    maturity: full
    summary: Password-gated read-only/comments/forms/tracked modes and permission ranges limiting who may edit which spans.
    where: [{repo: sdkjs, path: word/Editor/DocumentProtection.js}, {repo: sdkjs, path: word/Editor/annotations}]
  - key: accessibility-announcements
    name: Screen-reader announcement bridge (ARIA live region)
    category: accessibility
    maturity: partial
    summary: >
      Not speech synthesis (the Web Speech API appears nowhere): editor
      events — typed characters, caret moves by char/word, selection
      changes, story-part transitions, drawing selection via alt text,
      slide and cell/sheet navigation — are diffed from selection-state
      snapshots into localized text injected into a single visually-hidden
      assertive/atomic ARIA live region that the user's own screen reader
      voices. Suite-wide, toggled via a public API hook (outer shell) and
      an in-editor shortcut (public docs: Ctrl+Alt+Z). Public release
      notes: experimental ~v7.3, default-on ~v8.2.
    where:
      - {repo: sdkjs, path: common/workerspeech.js}
      - {repo: sdkjs, path: common/apiBase.js}
      - {repo: sdkjs, path: common/text_input2.js}
      - {repo: sdkjs, path: word/Editor/DocumentContentBase.js}
      - {repo: sdkjs, path: cell/view/WorksheetView.js}
      - {repo: sdkjs, path: common/Drawings/CommonController.js}
    notes: >
      Beyond the one live region there is no accessibility tree for
      document content — no DOM/ARIA mirror of the canvas document, no
      platform-AT bridges; AT gets event-driven announcements only. The
      C++ PDF writer can emit a tagged-PDF scaffold but no populated
      content structure. Replaces v1's incorrect "self-voicing speech
      layer" entry (key was accessibility-speech).
  - key: plugins-macros
    name: Plugin framework + JS macros
    category: plugins
    maturity: full
    summary: Iframe-sandboxed plugins with a published API, JS macros sharing the document-builder scripting API, and a macro recorder.
    where: [{repo: sdkjs, path: common/plugins.js}, {repo: sdkjs, path: common/macros.js}, {repo: sdkjs, path: common/macro-recorder.js}]
  - key: builder-api
    name: Document-builder scripting API
    category: plugins
    maturity: full
    summary: A headless scripting surface over the same model, runnable in the browser or server-side in the V8 renderer.
    where: [{repo: sdkjs, path: word/apiBuilder.js}, {repo: core, path: DesktopEditor/doctrenderer}]
  - key: json-model-bridge
    name: Model <-> JSON conversion layer
    category: plugins
    maturity: full
    summary: Bidirectional JSON representation of the whole document model for plugin/builder consumption.
    where: [{repo: sdkjs, path: word/fromToJSON.js}]

  # ---- file format & conversion ----
  - key: binary-snapshot-format
    name: Versioned internal binary snapshot
    category: docx-io
    maturity: full
    summary: The editor's native serialization, shared byte-for-byte with the C++ side; versioned with documented per-version default rules so old snapshots load.
    where: [{repo: sdkjs, path: word/Editor/Serialize2.js}, {repo: core, path: OOXML/Binary/Document}]
    notes: Unknown records are length-skipped — which is also how <w:bidiVisual> dies at this boundary (the C++ writer emits a record the JS reader lacks).
  - key: docx-regeneration-io
    name: DOCX via full-model regeneration
    category: docx-io
    maturity: full
    summary: Open converts docx fully into the binary model; save regenerates every part from the model. No byte preservation of untouched parts; unmodeled constructs can be lost.
    where: [{repo: core, path: OOXML/Binary/Document/BinWriter}, {repo: core, path: OOXML/Binary/Document/BinReader}]
    notes: Contrast with our sibling-byte-preserving strategy — this is their main fidelity trade-off. Verified casualties — <w:bidiVisual> (dropped) and the kashida jc values (degraded to left alignment on import, then saved as such).
  - key: ooxml-dom
    name: OOXML DOM libraries (C++)
    category: docx-io
    maturity: full
    summary: Typed C++ classes for the docx package and document.xml content (paragraphs, runs, tables, sections, sdt, fields, VML, math), used by all converters.
    where: [{repo: core, path: OOXML/DocxFormat}, {repo: core, path: OOXML/DocxFormat/Logic}]
  - key: x2t-hub
    name: x2t hub-and-spoke conversion
    category: conversion
    maturity: full
    summary: Every format converts to/from the internal binary hub (or direct docx<->odt/rtf paths); XML job tickets drive the tool; the format matrix is centrally declared.
    where: [{repo: core, path: X2tConverter/src}, {repo: core, path: Common}]
  - key: legacy-formats
    name: Legacy/interchange format converters
    category: conversion
    maturity: full
    summary: Binary .doc, RTF, ODF (odt), HTML, EPUB, FB2, HWP, and more, all via the conversion hub.
    where: [{repo: core, path: MsBinaryFile/DocFile}, {repo: core, path: RtfFile}, {repo: core, path: OdfFile}, {repo: core, path: HtmlFile2}, {repo: core, path: EpubFile}]
  - key: pdf-to-docx
    name: PDF-to-DOCX reconstruction
    category: conversion
    maturity: partial
    summary: Rendered PDF content reconstructed into editable docx (text/paragraph recovery from page geometry).
    where: [{repo: core, path: DocxRenderer}, {repo: core, path: PdfFile}]
  - key: encrypted-files
    name: Password-protected file handling
    category: conversion
    maturity: full
    summary: Standard/agile OOXML encryption read/write at the conversion boundary.
    where: [{repo: core, path: OfficeCryptReader}]
  - key: font-discovery
    name: System font discovery + font list generation
    category: fonts
    maturity: full
    summary: Scans font directories, resolves family/style names (incl. non-Latin names), and generates the font list + thumbnails the editors consume; also generates the Unicode-range-to-fallback-font table ("no squares" mode) from per-style codepoint coverage with a hand-ordered priority list.
    where: [{repo: core, path: DesktopEditor/fontengine}, {repo: core, path: DesktopEditor/AllFontsGen}, {repo: core, path: DesktopEditor/fontengine/ApplicationFontsWorker.cpp}]

  # ---- stability ----
  - key: autosave-change-stream
    name: Autosave as change streaming
    category: stability
    maturity: full
    summary: Idle/interval autosave ships change points, not snapshots; the server rebuilds state as snapshot + changes, which is also the crash-recovery path.
    where: [{repo: sdkjs, path: word/api.js}, {repo: sdkjs, path: common/docscoapi.js}]
  - key: error-codes
    name: Enumerated error surface
    category: stability
    maturity: full
    summary: Enumerated open/save/conversion/rights error codes surfaced to the shell through API events; the shell decides on reload or limited mode.
    where: [{repo: sdkjs, path: common/errorCodes.js}]
