features:
  # ---- layout & pagination ----
  - key: incremental-relayout-tiers
    name: Three-tier incremental relayout
    category: layout
    maturity: full
    summary: Run-range fast patch, single-paragraph fast relayout with invariant verification, and full page-anchored reflow as fallback; fast tiers self-verify bounds/end-state and demote on mismatch.
    where:
      - {repo: sdkjs, path: word/Editor/Paragraph_Recalculate.js}
      - {repo: sdkjs, path: word/Editor/Document.js}
  - key: timer-sliced-pagination
    name: Interruptible timer-sliced pagination
    category: layout
    maturity: full
    summary: Full reflow runs page-by-page on short timers with a small synchronous head start, repainting pages as they finish; new edits cancel and restart from the earlier dirty point.
    where: [{repo: sdkjs, path: word/Editor/Document.js}]
  - key: change-log-dirty-tracking
    name: Undo log as layout dirty tracker
    category: layout
    maturity: full
    summary: Recalculation derives its restart point from unprocessed change objects (same objects that drive undo and collab), folding in header/footer usage pages and keep-with-next backup.
    where: [{repo: sdkjs, path: word/Editor/History.js}, {repo: sdkjs, path: word/Editor/DocumentChanges.js}]
  - key: per-element-page-fragments
    name: Per-element per-page layout fragments
    category: layout
    maturity: full
    summary: Elements own arrays of per-page layout fragments (lines/rows), letting pagination resume mid-document and fast tiers patch in place.
    where: [{repo: sdkjs, path: word/Editor/Paragraph.js}, {repo: sdkjs, path: word/Editor/Table.js}]
  - key: line-as-ranges
    name: Line model as horizontal range segments
    category: layout
    maturity: full
    summary: Each line is a set of x-intervals; float wrap cutouts and column layout both reduce to range segmentation before line filling.
    where: [{repo: sdkjs, path: word/Editor/Paragraph_Recalculate.js}, {repo: sdkjs, path: word/Editor/FlowObjects.js}]
  - key: speculative-placement-rollback
    name: Speculative placement with layout snapshots
    category: layout
    maturity: full
    summary: Elements snapshot/restore layout state so pagination can try a placement and roll back when footnote space or keep rules reject it; element layout returns explicit control-flow result flags.
    where: [{repo: sdkjs, path: word/Editor/Paragraph_Recalculate.js}, {repo: sdkjs, path: word/Editor/Table/TableRecalculate.js}]
  - key: keep-rules-widow-orphan
    name: Keep-next/keep-lines/widow-orphan control
    category: layout
    maturity: full
    summary: Full support for paragraph pagination constraints including backing the reflow start point over keep-with-next chains.
    where: [{repo: sdkjs, path: word/Editor/Paragraph_Recalculate.js}]
  - key: read-mode-layout-policy
    name: Swappable layout policies (print vs reflow view)
    category: layout
    maturity: full
    summary: Print layout and a reflowable read mode are strategy objects over the same model; pagination queries the policy for page frames.
    where: [{repo: sdkjs, path: word/Editor/Layout}]

  # ---- text pipeline ----
  - key: wasm-font-engine
    name: FreeType+HarfBuzz WASM font engine
    category: text-pipeline
    maturity: full
    summary: All measurement/shaping/rastering goes through a WASM build of the C++ font stack, giving identical metrics across browsers and on the headless server renderer.
    where: [{repo: sdkjs, path: common/libfont}, {repo: core, path: DesktopEditor/fontengine}]
  - key: grapheme-interning
    name: Global shaped-grapheme interning
    category: text-pipeline
    maturity: full
    summary: Shaped clusters (font + glyphs + advances) are deduplicated in a global table addressed by integer ids; runs store grapheme ids plus widths.
    where: [{repo: sdkjs, path: common/libfont/grapheme.js}, {repo: sdkjs, path: common/libfont/textshaper.js}]
  - key: reference-size-shaping
    name: Shape once at reference size, scale linearly
    category: text-pipeline
    maturity: full
    summary: Shaping and metrics are computed at one large fixed size and scaled to actual run sizes/zoom, so caches are size-independent.
    where: [{repo: sdkjs, path: common/libfont/grapheme.js}]
  - key: streaming-bidi
    name: Streaming pragmatic BiDi reorder
    category: text-pipeline
    maturity: partial
    summary: A simplified streaming reorderer (strong/weak/neutral buffers, number grouping, bracket data) rather than full UAX #9 embedding levels; paragraph-level base direction with mirrored indents.
    where: [{repo: sdkjs, path: word/Editor/Paragraph/bidi-flow.js}, {repo: sdkjs, path: common/bidi}]
    notes: No kashida justification anywhere in the tree; RTL tables (bidiVisual) not implemented.
  - key: script-font-fallback
    name: Script itemization + font fallback
    category: text-pipeline
    maturity: full
    summary: Shaping buffers segment by script, direction, and resolved font (with substitution when the primary font lacks a codepoint).
    where: [{repo: sdkjs, path: common/libfont/textshaper.js}, {repo: sdkjs, path: word/Editor/Paragraph/TextShaper.js}]
  - key: auto-hyphenation
    name: Automatic hyphenation
    category: text-pipeline
    maturity: full
    summary: Pattern-based per-language hyphenation with lazily loaded language data, applied during line breaking when enabled.
    where: [{repo: sdkjs, path: word/Editor/Paragraph/TextHyphenator.js}, {repo: sdkjs, path: common/api/auto-hyphenation-settings.js}]
  - key: ligature-control
    name: Per-run ligature class control
    category: text-pipeline
    maturity: full
    summary: Runs carry a setting for which ligature classes the shaper should enable.
    where: [{repo: sdkjs, path: common/libfont/textshaper.js}]

  # ---- tables ----
  - key: table-grid-autofit
    name: Table grid normalization + AutoFit
    category: tables
    maturity: full
    summary: Declared column grid reconciled against actual cell spans, then min/max/preferred content widths resolve fixed/percent/auto layout into final column widths.
    where: [{repo: sdkjs, path: word/Editor/Table/TableRecalculate.js}]
  - key: table-row-splitting
    name: Row splitting across pages
    category: tables
    maturity: full
    summary: Rows split across page boundaries by splitting each cell's content with continuation state; vertically merged cells re-lay at the break; repeated header rows re-laid from per-page copies (inline top-level tables only, skipped when they don't fit).
    where: [{repo: sdkjs, path: word/Editor/Table/TableRecalculate.js}, {repo: sdkjs, path: word/Editor/Table/TableRow.js}]
    notes: The OOXML per-row can't-split flag is stored and round-tripped but NOT consumed by layout, and no UI exposes it — rows always split by content; only exact/at-least-height rows move to the next page whole.
  - key: table-border-conflicts
    name: Border conflict resolution
    category: tables
    maturity: full
    summary: A dedicated pass resolves border conflicts per the ECMA-376 rules — cell border beats table border, then wider wins, then the spec's brightness tie-breaks — including merged-cell and adjacent-row interactions; spacing tables draw per-cell borders with no conflict pass.
    where: [{repo: sdkjs, path: word/Editor/Table/TableRecalculate.js}, {repo: sdkjs, path: word/Editor/Table.js}]
  - key: table-styles-conditional
    name: Table styles with conditional bands
    category: tables
    maturity: full
    summary: All 13 OOXML conditional slots (whole table, first/last row/col, band1/band2 horiz/vert, four corner cells) layered per the spec order under the six table-look flags, with band-size grouping and Word-compat quirks (first-row formatting extends to header-flagged rows; cell text direction never comes from the style).
    where: [{repo: sdkjs, path: word/Editor/Styles.js}, {repo: sdkjs, path: word/Editor/Table/TableLook.js}, {repo: sdkjs, path: word/Editor/Table/TableCell.js}]
  - key: floating-tables
    name: Floating (positioned) tables
    category: tables
    maturity: full
    summary: Anchored H/V positioning with alignment or offsets, rectangular text wrap with distance-to-text, iterative overlap avoidance (push right, else below), page-bounds clamping; floating tables can split across pages (not in multi-column sections) but never repeat header rows.
    where: [{repo: sdkjs, path: word/Editor/Table.js}, {repo: sdkjs, path: word/Editor/FlowObjects.js}, {repo: sdkjs, path: word/Editor/Document.js}, {repo: sdkjs, path: word/Editor/Paragraph/ParaDrawing.js}]
  - key: cell-vertical-text
    name: Vertical cell text direction
    category: tables
    maturity: full
    summary: Per-cell text direction (both rotated orientations) supported in layout and editing.
    where: [{repo: sdkjs, path: word/Editor/Table/TableCell.js}]
  - key: table-formulas
    name: Table formula fields
    category: tables
    maturity: full
    summary: Expression-field parser with a function library and table cell references, evaluated on field update.
    where: [{repo: sdkjs, path: word/Editor/Paragraph/FormulaParser.js}]
  - key: rtl-tables
    name: RTL tables (bidiVisual)
    category: tables
    maturity: absent
    summary: No visual column mirroring for RTL tables in the word editor; the table layout module never consults paragraph/section direction at all (paragraph-level RTL inside cells works, table geometry is LTR-only).
    where: [{repo: sdkjs, path: word/Editor/Table.js}, {repo: sdkjs, path: word/Editor/Serialize2.js}]
    notes: The C++ conversion core round-trips <w:bidiVisual> (incl. a binary-format record for it), but the JS editor's binary vocabulary lacks that record, so the property is silently dropped when a document is edited and saved through the editor.

  # ---- sections, pages, headers/footers ----
  - key: sections-model
    name: Section model with all break types
    category: sections
    maturity: full
    summary: Section properties attach to paragraphs and aggregate into a section index; next-page/continuous/even/odd/column breaks; per-section page size, margins, gutter (incl. RTL side), page borders, title page.
    where: [{repo: sdkjs, path: word/Editor/sections}, {repo: sdkjs, path: word/Editor/document}]
  - key: multi-columns
    name: Multi-column sections
    category: sections
    maturity: full
    summary: Equal and unequal column widths with separators and column breaks; continuous section balancing.
    where: [{repo: sdkjs, path: word/Editor/sections/section-columns.js}, {repo: sdkjs, path: word/Editor/document/document-page-column.js}]
  - key: headers-footers
    name: Headers/footers with inheritance
    category: sections
    maturity: full
    summary: First/even/odd variants, link-to-previous as slot absence, watermarks, full document content inside; a dedicated re-layout pass updates page-count-dependent content.
    where: [{repo: sdkjs, path: word/Editor/HeaderFooter.js}, {repo: sdkjs, path: word/Editor/HeaderFooterController.js}]
  - key: line-numbering
    name: Line numbering
    category: sections
    maturity: full
    summary: Per-section line numbering with restart modes and count-by, painted in the margin.
    where: [{repo: sdkjs, path: word/Editor/sections/line-numbering.js}]

  # ---- fields, TOC, notes ----
  - key: complex-fields
    name: Complex fields (begin/separate/end)
    category: fields
    maturity: full
    summary: Sentinel run items matching the OOXML field-char model, an instruction parser producing typed fields (alphabetically DATE, HYPERLINK, MERGEFIELD, NOTEREF, NUMPAGES, PAGE, PAGEREF, REF, SEQ, STYLEREF, TIME, TOC, form fields, expressions), and a layout-time field stack.
    where:
      - {repo: sdkjs, path: word/Editor/Paragraph/ComplexField.js}
      - {repo: sdkjs, path: word/Editor/Paragraph/ComplexFieldInstruction.js}
      - {repo: sdkjs, path: word/Editor/Paragraph/ComplexFields}
    notes: Word's long tail of other field types is not modeled; simple fields are converted to the complex representation.
  - key: page-number-fields
    name: PAGE/NUMPAGES with post-pass update
    category: fields
    maturity: full
    summary: Page numbers paint from layout position; total-page counts update via a dedicated header/footer re-layout pass after pagination stabilizes.
    where: [{repo: sdkjs, path: word/Editor/Paragraph/RunContent/PageNum.js}, {repo: sdkjs, path: word/Editor/Paragraph/RunContent/PagesCount.js}]
  - key: toc
    name: Table of contents
    category: fields
    maturity: full
    summary: TOC field collects heading/outline-level paragraphs, regenerates its result content with page numbers, hyperlinks, and leader tabs; table-of-figures via SEQ.
    where: [{repo: sdkjs, path: word/Editor/Paragraph/ComplexFieldInstruction.js}, {repo: sdkjs, path: word/Editor/DocumentOutline.js}]
  - key: footnotes
    name: Footnotes with space negotiation
    category: notes
    maturity: full
    summary: Per-line reservation of page-bottom space, per-column placement, splitting across pages with continuation separator/notice stories, numbering restart modes and custom marks.
    where: [{repo: sdkjs, path: word/Editor/Footnotes.js}, {repo: sdkjs, path: word/Editor/Paragraph_Recalculate.js}]
  - key: endnotes
    name: Endnotes
    category: notes
    maturity: full
    summary: Registered during layout, flowed as a trailing story at section/document end with its own recalculation continuation.
    where: [{repo: sdkjs, path: word/Editor/Endnotes.js}]

  # ---- review, comments, collaboration ----
  - key: track-changes
    name: Track changes incl. move detection
    category: review
    maturity: full
    summary: Insert/delete/format/property revisions with per-user attribution, paired move-from/move-to ranges, accept/reject granularity, and a document-order change navigator.
    where: [{repo: sdkjs, path: word/Editor/revisions}, {repo: sdkjs, path: word/Editor/RevisionsChange.js}]
  - key: comments
    name: Ranged comments
    category: review
    maturity: full
    summary: Paired range markers survive edits; replies, resolve state, quote capture, comments in headers and text boxes.
    where: [{repo: sdkjs, path: word/Editor/Comments.js}]
  - key: compare-combine
    name: Document compare and combine
    category: review
    maturity: full
    summary: Client-side diff of two loaded models emitting tracked changes attributed to the compared author; combine merges two revision sets.
    where: [{repo: sdkjs, path: word/Editor/Comparison.js}, {repo: sdkjs, path: word/Editor/Merge.js}]
  - key: collab-change-streaming
    name: Change-based collaboration (fast + strict modes)
    category: collaboration
    maturity: full
    summary: Object-id-addressed invertible change objects stream through the document server; strict mode uses object-level locks with merge-on-save, fast mode streams live.
    where:
      - {repo: sdkjs, path: common/CollaborativeEditingBase.js}
      - {repo: sdkjs, path: word/Editor/CollaborativeEditing.js}
      - {repo: sdkjs, path: common/docscoapi.js}
  - key: collab-undo
    name: Collaborative undo + deleted-text recovery
    category: collaboration
    maturity: full
    summary: Undo of own changes by inversion with content-position fixups against later foreign changes; a recovery layer can restore text deleted by another user.
    where: [{repo: sdkjs, path: common/collaborativeHistory.js}, {repo: sdkjs, path: common/collaboration/deleted-text-recovery.js}]
  - key: version-history
    name: Server version history navigation
    category: collaboration
    maturity: full
    summary: Replays stored change streams over base snapshots to show any version with per-author change coloring.
    where: [{repo: sdkjs, path: common/versionHistory.js}]
  - key: undo-change-objects
    name: Invertible typed change objects
    category: undo
    maturity: full
    summary: Every mutation is a typed change with its own undo/redo/serialize; grouped into user-action points; temporary points for IME; same objects feed collab and layout dirtying.
    where: [{repo: sdkjs, path: word/Editor/History.js}, {repo: sdkjs, path: word/Editor/DocumentContentChanges.js}, {repo: sdkjs, path: common/HistoryCommon.js}]

  # ---- drawings, charts, math ----
  - key: floating-objects-wrap
    name: Floating drawings with wrap polygons
    category: drawings
    maturity: full
    summary: All OOXML wrap types; square wrap from bounds, tight/through from computed (and user-editable) wrap polygons contributing per-line x-interval cutouts.
    where: [{repo: sdkjs, path: word/Editor/FlowObjects.js}, {repo: sdkjs, path: word/Editor/GraphicObjects}]
  - key: drawingml-shapes
    name: Full DrawingML shape model
    category: drawings
    maturity: full
    summary: Preset/custom geometry, fills, outlines, groups, connectors, text bodies with autofit; shared across all suite editors.
    where: [{repo: sdkjs, path: common/Drawings/Format}]
  - key: charts
    name: Native canvas chart engine
    category: charts
    maturity: full
    summary: All major chart families incl. newer chart types drawn from the chart part model; data edited via an embedded spreadsheet.
    where: [{repo: sdkjs, path: common/Charts}]
  - key: smartart
    name: SmartArt rendering/editing
    category: drawings
    maturity: partial
    summary: SmartArt laid out from its definition data and editable at shape level; not full diagram re-layout semantics.
    where: [{repo: sdkjs, path: common/SmartArts}]
  - key: math-omml
    name: OMML math layout + linear input
    category: math
    maturity: full
    summary: Recursive OMML content layout inside paragraph lines; UnicodeMath and LaTeX input parsers; math autocorrect; legacy binary equations converted to OMML at import by the C++ core.
    where: [{repo: sdkjs, path: word/Math}, {repo: core, path: OOXML/Binary/MathEquation}]

  # ---- forms, content controls, mail merge ----
  - key: content-controls
    name: Structured document tags (inline + block)
    category: forms
    maturity: full
    summary: Rich/plain text, checkbox, combo/dropdown, date, picture controls with locking and placeholder handling.
    where: [{repo: sdkjs, path: word/Editor/StructuredDocumentTags}]
  - key: fixed-forms
    name: Fillable forms layer (oform)
    category: forms
    maturity: full
    summary: Fixed-size fields, comb text, keys/roles/required flags, a forms manager, form-filling mode with restricted undo, and PDF-form export via the conversion pipeline.
    where: [{repo: sdkjs, path: word/Editor/StructuredDocumentTags/FormsManager.js}, {repo: core, path: X2tConverter/src}]
  - key: mail-merge
    name: Mail merge
    category: mail-merge
    maturity: full
    summary: MERGEFIELD registry, spreadsheet data source, record preview, server-side merged output to docx/pdf/email.
    where: [{repo: sdkjs, path: word/Editor/Document.js}, {repo: sdkjs, path: word/Editor/Paragraph/ComplexFields/MergeField.js}]

  # ---- input, clipboard, search, spelling ----
  - key: hidden-input-ime
    name: Hidden input element + IME composition
    category: input
    maturity: full
    summary: Hidden textarea/contenteditable at the caret captures keys and composition; composition text inserted provisionally and finalized on composition end; platform quirks special-cased.
    where: [{repo: sdkjs, path: common/text_input.js}, {repo: sdkjs, path: word/Editor/document-composite-input.js}]
  - key: clipboard-multiflavor
    name: Multi-flavor clipboard
    category: clipboard
    maturity: full
    summary: Internal binary flavor for lossless intra-suite paste, generated HTML for external apps, plain text; large HTML import/normalization path for pastes from Word/Google Docs.
    where: [{repo: sdkjs, path: common/wordcopypaste.js}, {repo: sdkjs, path: common/clipboard_base.js}]
  - key: find-replace
    name: Find/replace across stories
    category: search
    maturity: full
    summary: Document-order search spanning body, headers/footers, footnotes, text boxes with ranged matches that survive relayout; highlight-all.
    where: [{repo: sdkjs, path: word/Editor/Search}]
  - key: spellcheck-wasm
    name: Hunspell WASM spellcheck in a worker
    category: spellcheck
    maturity: full
    summary: Per-paragraph incremental collection of dirty text, idle-batched checking in a worker, wavy underline painting, suggestions.
    where: [{repo: sdkjs, path: common/spell}, {repo: sdkjs, path: word/Editor/SpellChecker}]
  - key: autocorrect
    name: As-you-type autocorrect
    category: input
    maturity: full
    summary: Capitalization, hyperlink detection, smart quotes, list detection, math autocorrect, exception lists — applied against the recent-change window.
    where: [{repo: sdkjs, path: word/Editor/Paragraph/Run/RunAutoCorrect.js}, {repo: sdkjs, path: common/api/autoCorrectSettings.js}]

  # ---- rendering & view ----
  - key: canvas-mm-graphics
    name: mm-unit abstract 2D graphics layer
    category: rendering
    maturity: full
    summary: All painting goes through an abstract interface in document units with screen-canvas, recording (metafile), thumbnail, and native implementations.
    where: [{repo: sdkjs, path: word/Drawing/Graphics.js}, {repo: sdkjs, path: common/Drawings/Metafile.js}]
  - key: page-bitmap-cache
    name: Page bitmap cache
    category: rendering
    maturity: full
    summary: Rendered page images cached with lock/unused counters; scroll re-blits, only dirty pages repaint; selection/caret on a separate overlay canvas.
    where: [{repo: sdkjs, path: word/Drawing/cachemanager.js}, {repo: sdkjs, path: common/Overlay.js}]
  - key: print-command-stream
    name: Print/PDF via recorded command stream
    category: print
    maturity: full
    summary: The recording graphics backend captures a command stream replayed for print and server-side PDF generation, so export and screen cannot diverge.
    where: [{repo: sdkjs, path: common/Drawings/Metafile.js}, {repo: core, path: DesktopEditor/doctrenderer}]
  - key: rulers-ui
    name: Canvas rulers with drag interactions
    category: rendering
    maturity: full
    summary: Horizontal/vertical rulers with indent/tab/margin/column drag handles drawn and hit-tested in the view layer.
    where: [{repo: sdkjs, path: word/Drawing/Rulers.js}]

  # ---- styles & numbering ----
  - key: compiled-style-cache
    name: Compiled-property caching + interning
    category: styles
    maturity: full
    summary: Effective formatting compiled lazily (defaults, style chain, direct) and cached; formatting objects deduplicated via a ref-counted intern table keyed by serialized bytes.
    where: [{repo: sdkjs, path: word/Editor/Styles.js}, {repo: sdkjs, path: word/Editor/Styles/style-cache.js}]
  - key: numbering
    name: Multilevel numbering
    category: numbering
    maturity: full
    summary: Abstract definitions plus per-list overrides, restart/legal numbering, RTL-aware number rendering, incremental collection of numbered paragraphs.
    where: [{repo: sdkjs, path: word/Editor/Numbering}]

  # ---- protection, a11y, plugins ----
  - key: document-protection
    name: Protection modes + ranged permissions
    category: protection
    maturity: full
    summary: Password-gated read-only/comments/forms/tracked modes and permission ranges limiting who may edit which spans.
    where: [{repo: sdkjs, path: word/Editor/DocumentProtection.js}, {repo: sdkjs, path: word/Editor/annotations}]
  - key: accessibility-speech
    name: Self-voicing speech layer
    category: accessibility
    maturity: partial
    summary: Editor events (typing, caret moves, selection) converted to spoken text via a speech worker; no DOM accessibility tree for document content.
    where: [{repo: sdkjs, path: common/workerspeech.js}]
  - key: plugins-macros
    name: Plugin framework + JS macros
    category: plugins
    maturity: full
    summary: Iframe-sandboxed plugins with a published API, JS macros sharing the document-builder scripting API, and a macro recorder.
    where: [{repo: sdkjs, path: common/plugins.js}, {repo: sdkjs, path: common/macros.js}, {repo: sdkjs, path: common/macro-recorder.js}]
  - key: builder-api
    name: Document-builder scripting API
    category: plugins
    maturity: full
    summary: A headless scripting surface over the same model, runnable in the browser or server-side in the V8 renderer.
    where: [{repo: sdkjs, path: word/apiBuilder.js}, {repo: core, path: DesktopEditor/doctrenderer}]
  - key: json-model-bridge
    name: Model <-> JSON conversion layer
    category: plugins
    maturity: full
