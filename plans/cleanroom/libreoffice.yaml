    category: rtl-ctl
    maturity: full
    summary: Western/CJK/CTL each carry independent font/size/weight/posture/language on every run; slot choice is bidi-aware, not purely per-codepoint — characters in RTL runs are forced to the CTL slot (Asian scripts excepted), embedded digit-only LTR runs inside Arabic too; weak characters inherit the preceding run's script, leading weak characters take the paragraph's first non-weak script; an ODF attribute can pin the classification.
