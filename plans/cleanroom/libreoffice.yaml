# Sanitized clean-room index of the LibreOffice core tree (Reader-produced).
# Purpose: targeted pointers for future Reader dives. Implementers must not
# open any path listed here (see plans/cleanroom/PROTOCOL.md).
# All paths are relative to the reference checkout root and were verified to
# exist at the studied commit.

provenance:
  repo: https://github.com/LibreOffice/core.git
  commit: 3b30dd71049edf71a5c649c9aefa31538542c294
  branch: master
  commit_date: "2026-08-21"
  studied: "2026-08-22 (v1 pass + v2 synthesis pass after independent verification round, same day)"
  license: MPL-2.0
  local_path: /data/code/reference/libreoffice-core

areas:
  - name: writer-document-model
    dirs: [sw/source/core/doc, sw/source/core/docnode, sw/source/core/txtnode, sw/source/core/attr, sw/inc]
  - name: writer-layout-engine
    dirs: [sw/source/core/layout, sw/source/core/inc]
  - name: writer-text-formatting
    dirs: [sw/source/core/text]
  - name: writer-object-positioning
    dirs: [sw/source/core/objectpositioning, sw/source/core/draw]
  - name: writer-cursor-editing
    dirs: [sw/source/core/crsr, sw/source/core/edit, sw/source/core/frmedt]
  - name: writer-undo
    dirs: [sw/source/core/undo]
  - name: writer-fields-toc
    dirs: [sw/source/core/fields, sw/source/core/tox]
  - name: writer-numbering
    dirs: [sw/source/core/SwNumberTree]
  - name: writer-tables-model
    dirs: [sw/source/core/table]
  - name: writer-uno-api
    dirs: [sw/source/core/unocore]
  - name: writer-accessibility
    dirs: [sw/source/core/access]
  - name: writer-ui-shell
    dirs: [sw/source/uibase]
  - name: docx-rtf-import
    dirs: [sw/source/writerfilter/dmapper, sw/source/writerfilter/ooxml, sw/source/writerfilter/rtftok, sw/source/writerfilter/filter]
  - name: doc-docx-rtf-export
    dirs: [sw/source/filter/ww8]
  - name: odf-filter
    dirs: [xmloff, sw/source/filter/xml]
  - name: other-writer-filters
    dirs: [sw/source/filter/html, sw/source/filter/md, sw/source/filter/ascii]
  - name: shared-items-undo
    dirs: [svl]
  - name: shared-edit-engine
    dirs: [editeng/source]
  - name: toolkit-text-fonts-pdf
    dirs: [vcl/source/text, vcl/source/font, vcl/source/gdi, vcl/source/pdf]
  - name: drawing-stack
    dirs: [svx, drawinglayer, basegfx]
  - name: i18n-services
    dirs: [i18npool/source, i18nutil, i18nlangtag]
  - name: linguistics
    dirs: [linguistic, lingucomponent]
  - name: ooxml-shared
    dirs: [oox/source]
  - name: tiled-rendering
    dirs: [libreofficekit, desktop/source/lib]
  - name: stability-recovery
    dirs: [framework/source/services, sfx2/source/doc]
  - name: math
    dirs: [starmath]
  - name: charts
    dirs: [chart2]

features:
  # ---------- layout engine ----------
  - key: frame-tree-model
    name: Layout frame tree
    category: layout
    maturity: full
    summary: Per-view derived tree of page/column/header/footer/footnote/body/section/table/row/cell/fly/text frames; disposable cache over the model.
    where: [sw/source/core/inc/frame.hxx, sw/source/core/layout/newfrm.cxx, sw/source/core/layout/wsfrm.cxx]
  - key: invalidation-repair-loop
    name: Invalidate-then-repair layout
    category: layout
    maturity: full
    summary: Position/size/inner-area validity flags per frame plus per-page dirty-summary bits (content/structure/three fly variants/page-anchored objects) for O(1) clean-page skipping; a root-level single-dirty-frame fast path serves plain typing; a stack-scoped layout action walks pages front to back with backtracking when earlier pages re-dirty, an off-screen skip that first stabilizes the next page break, and interrupt-then-clean-up-visible-pages semantics.
    where: [sw/source/core/layout/layact.cxx, sw/source/core/inc/layact.hxx, sw/source/core/layout/calcmove.cxx, sw/source/core/layout/wsfrm.cxx, sw/source/core/inc/frame.hxx, sw/source/core/inc/pagefrm.hxx, sw/source/core/inc/rootfrm.hxx]
  - key: idle-layout
    name: Idle background formatting
    category: layout
    maturity: full
    summary: Lowest-priority idle task whose readiness probe keeps it asleep while any view is busy; one prioritized job per wake (grammar kickoff > idle layout > field update); visible-page background jobs run before full-document repair; a completion scan over page summary bits ends in an explicit layout-finished document event.
    where: [sw/source/core/doc/SwDocIdle.cxx, sw/source/core/doc/DocumentTimerManager.cxx, sw/source/core/inc/DocumentTimerManager.hxx, sw/source/core/layout/layact.cxx]
  - key: flow-master-follow
    name: Master/follow flow chains
    category: layout
    maturity: full
    summary: Shared flow behavior lets paragraphs, tables, and sections split into frame chains across pages/columns with forward and backward movement.
    where: [sw/source/core/layout/flowfrm.cxx, sw/source/core/inc/flowfrm.hxx, sw/source/core/layout/calcmove.cxx]
  - key: grow-shrink-negotiation
    name: Grow/shrink space negotiation
    category: layout
    maturity: full
    summary: Children request space from parents through one protocol used by footnote areas, sections, cells, and headers/footers.
    where: [sw/source/core/layout/wsfrm.cxx, sw/source/core/layout/ssfrm.cxx]
  - key: layout-loop-control
    name: Pagination loop watchdog
    category: layout
    maturity: full
    summary: Counts repair rounds in a sliding page window (progress in either direction resets counter and stage) and escalates through force-validation stages that widen from ordinary frames to floating objects to everything; backed by a moved-forward-by-object registry, backward-move suppression keyed by frame identity plus target-geometry fingerprint, a per-object grows-cell counter, and hard iteration caps convertible to test failures.
    where: [sw/source/core/layout/layouter.cxx, sw/source/core/inc/layouter.hxx, sw/source/core/layout/movedfwdfrmsbyobjpos.cxx]
  - key: layout-cache
    name: Persisted pagination cache
    category: layout
    maturity: full
    summary: Per-page break records (body-relative node index, paragraph/table tag, split offset) plus floating-object position records, written as a versioned self-delimiting binary stream in the ODF package and consumed on load with split-before-format follow creation, a discard-all sanity pass, and a lock/consume discipline. ODF-only — foreign formats feed only a statistics-based page-count estimate for page pre-allocation.
    where: [sw/source/core/layout/laycache.cxx, sw/source/core/inc/laycache.hxx, sw/source/core/layout/layhelp.hxx, sw/source/core/layout/frmtool.cxx, sw/source/filter/xml/wrtxml.cxx, sw/source/filter/xml/swxml.cxx]
  - key: page-styles-sequencing
    name: Page styles and sequencing
    category: sections-pages
    maturity: full
    summary: Page geometry owned by page styles with first/left/right variants and next-style chains; OOXML sections map onto this on import.
    where: [sw/source/core/layout/pagedesc.cxx, sw/source/core/layout/pagechg.cxx]
  - key: columns
    name: Multi-column layout
    category: sections-pages
    maturity: full
    summary: Columns at page-style and section level, with balancing and column breaks.
    where: [sw/source/core/layout/colfrm.cxx, sw/source/core/layout/sectfrm.cxx]
  - key: sections
    name: Text sections
    category: sections-pages
    maturity: full
    summary: Nestable body regions with own columns, protection, hidden/conditional visibility, section-end note collection, file/DDE linkage.
    where: [sw/source/core/layout/sectfrm.cxx, sw/source/core/docnode/ndsect.cxx, sw/source/core/docnode/section.cxx]
  - key: headers-footers
    name: Headers and footers
    category: sections-pages
    maturity: full
    summary: Per page style, shared or distinct left/right/first, with dynamic height negotiation against the body.
    where: [sw/source/core/layout/hffrm.cxx, sw/source/core/inc/hffrm.hxx]
  - key: vertical-writing
    name: Vertical and mixed writing modes
    category: layout
    maturity: full
    summary: A function-pointer geometry-accessor table abstracts horizontal vs three vertical writing modes for pagination code; horizontal RTL is NOT an accessor variant — it is a separate lazily-derived per-frame flag applied by explicit mirroring at sibling-positioning/editing sites plus LTR/RTL coordinate-swap helpers at the paragraph-frame boundary (two composable abstractions, not one).
    where: [sw/source/core/inc/frame.hxx, sw/source/core/inc/txtfrm.hxx, sw/source/core/layout/wsfrm.cxx, sw/source/core/layout/calcmove.cxx, sw/source/core/text/frmform.cxx]
  - key: rtl-tables
    name: Right-to-left table column order
    category: layout
    maturity: full
    summary: RTL visual column order (the w:bidiVisual equivalent) end to end — frame-direction attribute on the table model (public WritingMode property with inherit-from-environment), DOCX/RTF/binary-DOC round-trip with unit tests, first cell anchored at the row's right edge with successors leftward and recursive invalidation on direction change, direction-aware editing (dialog control, RTL-aware ruler dragging, border-edge swapping, mirrored cursor clamping).
    where: [sw/source/writerfilter/dmapper/DomainMapperTableManager.cxx, sw/source/filter/ww8/docxtableexport.cxx, sw/source/writerfilter/rtftok/rtfdispatchflag.cxx, sw/source/filter/ww8/ww8par2.cxx, sw/source/core/layout/wsfrm.cxx, sw/source/core/layout/tabfrm.cxx, sw/source/core/docnode/ndtbl1.cxx, sw/source/core/frmedt/fetab.cxx, sw/source/uibase/uiview/viewtab.cxx, sw/source/ui/table/tabledlg.cxx, sw/qa/extras/ooxmlexport/ooxmlexport.cxx]

  # ---------- text formatting ----------
  - key: line-portion-model
    name: Line builder portion model
    category: text-formatting
    maturity: full
    summary: Each formatted line is a chain of typed portions (text, glue, tab, field, footnote ref, fly gap, hyphen, drop cap, bidi/ruby multiportions).
    where: [sw/source/core/text/porlay.cxx, sw/source/core/text/portxt.cxx, sw/source/core/text/pormulti.cxx, sw/source/core/text/itrform2.cxx]
  - key: line-break-guess
    name: Guess-and-fit line breaking
    category: text-formatting
    maturity: full
    summary: Measure to an estimated break, snap to a locale break-iterator opportunity, correct underflow/overflow, hyphenate on demand.
    where: [sw/source/core/text/guess.cxx, sw/source/core/text/txthyph.cxx]
  - key: reformat-range-earlyout
    name: Incremental paragraph reformat
    category: text-formatting
    maturity: full
    summary: Paragraph records the changed character range; reformat starts at the first affected line and stops when breaks resynchronize.
    where: [sw/source/core/text/porlay.hxx, sw/source/core/text/frmform.cxx, sw/source/core/text/txtfrm.cxx]
  - key: script-info-cache
    name: Per-paragraph script/bidi cache
    category: rtl-ctl
    maturity: full
    summary: Script runs, bidi levels, and hidden ranges computed per paragraph revision and shared by layout, cursor, and paint; also holds a kashida-capable-script flag and the chosen kashida positions, which are a per-justification font-dependent product written back after line adjustment (not precomputed per revision).
    where: [sw/source/core/text/porlay.cxx, sw/source/core/text/porlay.hxx, sw/source/core/inc/scriptinfo.hxx, sw/source/core/text/itratr.cxx]
  - key: kashida-justification
    name: Kashida justification
    category: rtl-ctl
    maturity: full
    summary: One font-validated insertion point per word chosen at justification time by a shared i18n utility (Arabic — the public IE 5.5 connection-priority ladder with documented amendments; Syriac — outside-in from word end); validity from HarfBuzz's safe-to-insert-tatweel glyph flag via a trial word layout (AAT fonts excluded); user-typed tatweel forces, ZWNJ excludes adjacent positions; points join spaces as glue units with insufficient-width dropping; rendering inserts actual repeated tatweel glyphs at the device layer; draw/measure/hit-test share one widened advance array so caret geometry matches rendering by construction; the edit engine shares the same chooser.
    where: [i18nutil/source/utility/kashida.cxx, include/i18nutil/kashida.hxx, i18nutil/qa/cppunit/test_kashida.cxx, sw/source/core/text/itradj.cxx, sw/source/core/txtnode/justify.cxx, sw/source/core/txtnode/fntcache.cxx, vcl/source/outdev/font.cxx, vcl/source/gdi/CommonSalLayout.cxx, vcl/inc/justificationdata.hxx, editeng/source/editeng/impedit3.cxx]
  - key: kashida-jc-ooxml
    name: OOXML kashida justification levels
    category: rtl-ctl
    maturity: full
    summary: The lowKashida/mediumKashida/highKashida w:jc values are imported as block-justify plus escalating word-spacing-maximum percentages and exported back by matching those percentages — an approximation, not distinct engine kashida-length modes.
    where: [sw/source/writerfilter/dmapper/DomainMapper.cxx, sw/source/filter/ww8/docxattributeoutput.cxx]
  - key: bidi-multiportion
    name: Bidi segment layout
    category: rtl-ctl
    maturity: full
    summary: Direction changes within a line become nested sub-line portions; paragraph direction can auto-derive; per-line UAX 9 reordering.
    where: [sw/source/core/text/pormulti.cxx, sw/source/core/text/porlay.cxx]
  - key: widow-orphan
    name: Widow/orphan and keep rules
    category: text-formatting
    maturity: full
    summary: Widow/orphan minima, keep-with-next, and break rules drive frame splitting and backward moves.
    where: [sw/source/core/text/widorp.cxx, sw/source/core/text/frmform.cxx]
  - key: drop-caps
    name: Drop caps
    category: text-formatting
    maturity: full
    summary: Initial-character portions spanning several lines with whole-word option and automatic size fitting.
    where: [sw/source/core/text/txtdrop.cxx]
  - key: text-frame-cache
    name: Formatted-line cache
    category: text-formatting
    maturity: full
    summary: Bounded cache of formatted line structures; rarely painted paragraphs drop and rebuild them on demand.
    where: [sw/source/core/text/txtcache.cxx]
  - key: hidden-text
    name: Hidden text and fields display
    category: text-formatting
    maturity: full
    summary: Hidden ranges from attributes/fields are skipped or revealed per view; a model-to-view offset helper maps between representations.
    where: [sw/source/core/txtnode/modeltoviewhelper.cxx, sw/source/core/text/porrst.cxx]

  # ---------- document model ----------
  - key: node-array-regions
    name: Flat node array with hidden regions
    category: document-model
    maturity: full
    summary: One array with paired begin/end markers encodes nesting; fixed top-level regions hold footnote text, header/footer/fly text, tracked deletions, and body.
    where: [sw/source/core/docnode/nodes.cxx, sw/source/core/docnode/node.cxx]
  - key: attribute-spans
    name: Paragraph attribute spans
    category: document-model
    maturity: full
    summary: Sorted span array per paragraph mixing flat formatting spans, nested spans (links, ruby, meta), and zero-width anchors with placeholder characters.
    where: [sw/source/core/txtnode/ndhints.cxx, sw/source/core/txtnode/ndtxt.cxx, sw/source/core/txtnode/fmtatr2.cxx]
  - key: pooled-item-sets
    name: Pooled items and inherited item sets
    category: styles
    maturity: full
    summary: Refcount-pooled property objects; parent-chained sets implement style inheritance and direct-formatting override resolution.
    where: [svl/source/items, sw/source/core/attr]
  - key: style-families
    name: Style families
    category: styles
    maturity: full
    summary: Character, paragraph, frame, page, list, table styles; built-ins carry stable programmatic names separate from translated UI names; conditional paragraph styles.
    where: [sw/source/core/doc/fmtcol.cxx, sw/source/core/doc/DocumentStylePoolManager.cxx, sw/source/core/doc/SwStyleNameMapper.cxx]
  - key: manager-facets
    name: Document manager facets
    category: document-model
    maturity: full
    summary: The document object delegates to ~25 single-purpose managers behind narrow interfaces (fields, redlines, lists, undo, timers, settings, statistics).
    where: [sw/source/core/doc, sw/source/core/inc/DocumentContentOperationsManager.hxx]
  - key: undo-model
    name: Undo/redo model
    category: document-model
    maturity: full
    summary: Inverse-operation objects with attribute history; deleted content stashed in a hidden node region; compound actions bracketed under one user entry.
    where: [sw/source/core/undo/docundo.cxx, sw/source/core/undo/rolbck.cxx, sw/source/core/undo/undel.cxx, svl/source/undo]
  - key: bookmarks-marks
    name: Bookmarks and range marks
    category: document-model
    maturity: full
    summary: Position-anchored marks (bookmarks, annotation ranges, form fieldmarks, cross-reference marks) maintained across edits by a mark manager.
    where: [sw/source/core/crsr/bookmark.cxx, sw/source/core/inc/MarkManager.hxx, sw/source/core/doc/docbm.cxx]

  # ---------- tables ----------
  - key: table-split
    name: Table split across pages
    category: tables
    maturity: full
    summary: Two-attempt protocol — in-row split via a layout-only continuation row (zero-out-and-reformat rebuild verified for non-empty fragments and fit), else whole-row move — with bounded retry counters; repeated header rows cloned to follows or deliberately omitted when the incoming row cannot fit under them (with an interop fallback zeroing the model repeat count); span groups move atomically with span-continuation stub rows; row-keep with escape valves; footnote rescue oracle and single-shot regained-space retry.
    where: [sw/source/core/layout/tabfrm.cxx, sw/source/core/inc/tabfrm.hxx, sw/source/core/inc/rowfrm.hxx, sw/source/core/inc/cellfrm.hxx, sw/source/core/text/widorp.cxx, sw/source/core/layout/layouter.cxx]
  - key: nested-tables
    name: Nested tables
    category: tables
    maturity: full
    summary: Cells contain full node ranges, so tables nest arbitrarily and split logic recurses.
    where: [sw/source/core/layout/tabfrm.cxx, sw/source/core/docnode/ndtbl.cxx]
  - key: table-autolayout
    name: Auto table layout (AutoFit)
    category: tables
    maturity: full
    summary: Two-pass min/max content-width measurement distributes column widths, in the style of CSS auto table layout.
    where: [sw/source/core/doc/htmltbl.cxx, sw/source/core/doc/tblrwcl.cxx]
  - key: table-styles
    name: Table styles / autoformat
    category: tables
    maturity: full
    summary: Reusable table formatting bundles with row/column banding and region-specific formats.
    where: [sw/source/core/doc/tblafmt.cxx, sw/source/filter/ww8/docxtablestyleexport.cxx]
  - key: table-formulas
    name: Table cell formulas
    category: tables
    maturity: full
    summary: Spreadsheet-like formulas over cell references inside text tables, with recalculation.
    where: [sw/source/core/fields/cellfml.cxx, sw/source/core/fields/tblcalc.cxx]
  - key: split-fly-tables
    name: Floating tables that split
    category: tables
    maturity: full
    summary: Tables anchored in floating frames can break across pages, matching Word's floating-table behavior.
    where: [sw/source/core/layout/tabfrm.cxx, sw/source/core/layout/flycnt.cxx]

  # ---------- notes, fields, indexes ----------
  - key: footnote-negotiation
    name: Footnote space negotiation
    category: notes
    maturity: full
    summary: Per-host (page/column) footnote areas bounded by two budgets (page-style maximum and a reserved minimum body fraction); a deadline computed during line formatting keeps the area from growing above the bottom of the reference line; notes split into master/follow chains with configurable continuation notices; reference moves migrate notes via collect, fold follows in, condense to zero height, re-insert, reformat under backward-move lock; adjacent chain parts self-merge; dummy filler lines break wrap/footnote oscillation.
    where: [sw/source/core/layout/ftnfrm.cxx, sw/source/core/inc/ftnfrm.hxx, sw/source/core/inc/ftnboss.hxx, sw/source/core/text/txtftn.cxx, sw/source/core/text/widorp.cxx, sw/source/core/doc/docftn.cxx, sw/inc/ftninfo.hxx, sw/source/core/layout/pagechg.cxx, sw/source/core/layout/colfrm.cxx]
  - key: endnote-collection
    name: Endnotes at section/document end
    category: notes
    maturity: full
    summary: Three placement modes — dedicated endnote pages appended after content (native; footnotes-at-document-end produce dedicated footnote pages before them), section-end collection via a document-global collector pass that cuts notes out, reflows the section, and re-inserts them after its last content, and a Word-compat continuous mode synthesizing an endnote section at the end of the body.
    where: [sw/source/core/layout/layouter.cxx, sw/source/core/layout/sectfrm.cxx, sw/source/core/layout/ftnfrm.cxx]
  - key: field-model
    name: Field type/instance model
    category: fields
    maturity: full
    summary: Shared per-type objects plus per-instance state; expansion text cached because evaluation may need finished layout; updates run positionally sorted.
    where: [sw/source/core/fields/fldbas.cxx, sw/source/core/fields/expfld.cxx, sw/source/core/doc/DocumentFieldsManager.cxx, sw/source/core/doc/docfld.cxx]
  - key: field-inventory
    name: Field inventory
    category: fields
    maturity: full
    summary: Page numbers, doc info, references, conditions, variables, input, database, user, script, dropdown, chapter, bibliography fields.
    where: [sw/source/core/fields/docufld.cxx, sw/source/core/fields/reffld.cxx, sw/source/core/fields/chpfld.cxx, sw/source/core/fields/authfld.cxx]
  - key: toc-generation
    name: TOC and index generation
    category: fields
    maturity: full
    summary: Indexes generated into read-only sections from headings, marks, and captions; tokenized entry templates drive tab-stop layout; hyperlinked entries.
    where: [sw/source/core/doc/doctxm.cxx, sw/source/core/tox/ToxTextGenerator.cxx, sw/source/core/tox/txmsrt.cxx]

  # ---------- numbering ----------
  - key: numbering-tree
    name: Hierarchical numbering trees
    category: numbering
    maturity: full
    summary: Counting maintained in per-list trees of numbered nodes with phantom levels; list identity is separate from list style.
    where: [sw/source/core/SwNumberTree, sw/source/core/doc/number.cxx, sw/source/core/doc/list.cxx, sw/source/core/doc/DocumentListsManager.cxx]
  - key: outline-numbering
    name: Outline/chapter numbering
    category: numbering
    maturity: full
    summary: A special outline rule ties heading styles to levels; outline level can also exist without list membership.
    where: [sw/source/core/doc/docnum.cxx, sw/source/core/doc/DocumentOutlineNodesManager.cxx]

  # ---------- change tracking, comments ----------
  - key: redline-model
    name: Redline storage model
    category: redlining
    maturity: full
    summary: Position-sorted range records for insert/delete/format/table/move with author/date stacks; deleted content moved to a hidden node region.
    where: [sw/source/core/doc/docredln.cxx, sw/source/core/doc/DocumentRedlineManager.cxx, sw/inc/IDocumentRedlineAccess.hxx]
  - key: redline-hide-merge
    name: Hide-changes merged text frames
    category: redlining
    maturity: full
    summary: With changes hidden, one layout text frame spans multiple model paragraphs via an extent map translating view offsets to model positions.
    where: [sw/source/core/inc/txtfrm.hxx, sw/source/core/text/redlnitr.cxx, sw/source/core/text/txtfrm.cxx]
  - key: document-compare
    name: Document compare/merge
    category: redlining
    maturity: full
    summary: Diffing two documents produces redlines; merging combines tracked changes from copies.
    where: [sw/source/core/doc/doccomp.cxx]
  - key: comments
    name: Comments (annotations)
    category: comments
    maturity: full
    summary: Point or range anchored, threaded with resolve state; body text lives in a small embedded edit engine; sidebar UI outside pagination.
    where: [sw/source/core/fields/postithelper.cxx, sw/source/uibase/docvw/PostItMgr.cxx, sw/source/core/fields/textapi.cxx]

  # ---------- objects and wrap ----------
  - key: anchoring-model
    name: Object anchoring model
    category: objects-wrap
    maturity: full
    summary: Page/paragraph/character/as-character/frame anchors; as-character objects occupy a placeholder character and size the line.
    where: [sw/source/core/layout/flycnt.cxx, sw/source/core/layout/flyincnt.cxx, sw/source/core/layout/fly.cxx]
  - key: text-wrap
    name: Text wrap around objects
    category: objects-wrap
    maturity: full
    summary: Wrap modes including contour polygons and transparent-through; line builder inserts gap portions where objects intersect lines.
    where: [sw/source/core/text/txtfly.cxx, sw/source/writerfilter/dmapper/WrapPolygonHandler.cxx]
  - key: object-positioning
    name: Anchored-object position resolution
    category: objects-wrap
    maturity: full
    summary: Dedicated subsystem iterates object position vs. text flow to a fixpoint, with counters capping repeated wrap-driven forward moves.
    where: [sw/source/core/objectpositioning, sw/source/core/layout/objectformatter.cxx, sw/source/core/layout/movedfwdfrmsbyobjpos.cxx]
  - key: frame-chaining
    name: Chained text frames
    category: objects-wrap
    maturity: full
    summary: Overflow text flows from one floating frame into a designated next frame.
    where: [sw/source/core/layout/flycnt.cxx, sw/source/core/doc/docfly.cxx]
  - key: textbox-shapes
    name: Shape text boxes
    category: objects-wrap
    maturity: full
    summary: A drawing shape pairs with a hidden text frame so shape text gets full Writer layout.
