name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-native:
    name: Native (fmt + clippy + test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --release

  wasm:
    name: WASM build + size budget
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Build engine-wasm (release)
        run: wasm-pack build --target web --release crates/engine-wasm

      - name: Enforce WASM size budget (<15 MB)
        run: |
          set -euo pipefail
          WASM_PATH="crates/engine-wasm/pkg/engine_wasm_bg.wasm"
          if [ ! -f "$WASM_PATH" ]; then
              echo "ERROR: $WASM_PATH not produced"
              exit 1
          fi
          SIZE_BYTES=$(wc -c < "$WASM_PATH")
          BUDGET_BYTES=15728640
          echo "WASM size: $SIZE_BYTES bytes ($((SIZE_BYTES / 1024)) KiB)"
          echo "Budget:    $BUDGET_BYTES bytes (15 MiB)"
          if [ "$SIZE_BYTES" -ge "$BUDGET_BYTES" ]; then
              echo "FAIL: WASM artifact exceeds 15 MiB budget"
              exit 1
          fi
          echo "OK: under budget"

      - name: Run WASM tests (headless Chrome)
        run: wasm-pack test --headless --chrome crates/engine-wasm

  qa-harness:
    name: QA harnesses (visual-diff + memory)
    runs-on: ubuntu-24.04
    # Non-blocking (Phase 5 D5.1/D5.2): golden pixel-reproducibility on the
    # GitHub runner's Chrome is not yet proven, so a mismatch must surface
    # without breaking main. Promote to a required check once verified.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Build engine-wasm (release)
        run: wasm-pack build --target web --release crates/engine-wasm

      - name: Install JS dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          pnpm --dir ts install --frozen-lockfile
          pnpm --dir tools/visual-diff install --frozen-lockfile
          pnpm --dir tools/memory-profile install --frozen-lockfile
          pnpm --dir tools/perf install --frozen-lockfile

      - name: Run visual-diff, memory + performance harnesses
        run: |
          set -uo pipefail
          pnpm --dir ts dev &
          DEV_PID=$!
          for _ in $(seq 1 60); do
            curl -sf http://localhost:5173 >/dev/null 2>&1 && break
            sleep 1
          done
          node tools/visual-diff/run.mjs --tier A
          VD=$?
          node tools/memory-profile/run.mjs --budgets
          MP=$?
          node tools/perf/run.mjs --strict
          PF=$?
          kill "$DEV_PID" 2>/dev/null || true
          echo "visual-diff exit=$VD  memory-profile exit=$MP  perf exit=$PF"
          [ "$VD" -eq 0 ] && [ "$MP" -eq 0 ] && [ "$PF" -eq 0 ]
