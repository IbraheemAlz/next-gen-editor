name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-native:
    name: Native (fmt + clippy + test)
    runs-on: ubuntu-24.04
    # Issue #287 — explicit cap now that the job also runs the release-
    # profile shape-regression + roundtrip harnesses (~45 s warm).
    timeout-minutes: 30
    # Issue #342 — `issues: read` lets the parity step ask `gh` whether the
    # issues the command gaps cite are still open.
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # Issue #412 — `fuzz/` is its own workspace, so `--all` above does
      # not reach it.
      - name: cargo fmt --check (fuzz crate)
        run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --release

      # Issue #321 — `engine-wasm`'s `fuzz-native` feature is off by default
      # (and never built into the wasm artifact), so the step above
      # collects ZERO of the tests gated on it: the only native tests that
      # drive real `Command`s through `Engine::apply` (the fuzz-surface
      # smoke test, the `OpenDocument.defaults` bridge tests). Run them
      # explicitly and assert the count so a future `cfg` slip that
      # silently drops them to 0 goes red instead of green. (Since #318
      # `tools/corpus-native` depends on the feature, so feature
      # unification turns it on for the `--workspace` step too — this
      # step stays the guaranteed, counted run.)
      - name: cargo test engine-wasm (fuzz-native feature)
        run: |
          set -euo pipefail
          cargo test -p engine-wasm --release --features fuzz-native 2>&1 | tee fuzz-native-test.log
          # The feature-gated tests specifically (the ungated ones alone
          # already pass 289 tests, so a bare "N passed" cannot catch the
          # gate going dark).
          for t in fuzz_native_surface_drives_engine_end_to_end \
                   open_document_bridge_defaults_page_size_letter_reaches_the_parser \
                   open_document_bridge_widow_control_false_reproduces_pinned_pre_95_fingerprints; do
            if ! grep -q "tests::$t ... ok" fuzz-native-test.log; then
              echo "::error::feature-gated test $t did not run / pass"
              exit 1
            fi
          done

      # Issue #287 — both harnesses are documented gates and run by every
      # local merge gate; nothing in CI ran them, so a rustybuzz shaping
      # change or a `.docx` round-trip drift would have passed. Release
      # profile (the same one `cargo test --release` above just warmed in
      # the cached target dir). Measured locally on a warm cache:
      # shape-regression ~4 s, roundtrip ~40 s, `--fixtures` <1 s.
      - name: shape-regression (rustybuzz snapshots)
        run: cargo run -p shape-regression --release

      # Issue #342 — the Command parity matrix: `bridge::meta` joined with
      # the @nge/core facade map, the UI's data-nge-command /
      # data-nge-pending-issue badges, e2e usage and fuzz coverage. The
      # Markdown report lands in this job's summary (GitHub Issues stays the
      # backlog — no committed report file); a failed floor check fails the
      # step (the same floor also runs as `parity`'s unit tests in the
      # `cargo test` step above). `--verify-issues` checks every cited
      # issue is still OPEN; a `gh` error is only a warning.
      - name: Command parity matrix (issue #342)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cargo run -p parity --release -- --verify-issues | tee -a "$GITHUB_STEP_SUMMARY"

      - name: roundtrip harness (default + fixtures)
        run: |
          set -euo pipefail
          mkdir -p roundtrip-dump
          cargo run -p roundtrip --release 2>&1 | tee roundtrip-dump/default.log
          cargo run -p roundtrip --release -- --fixtures 2>&1 | tee roundtrip-dump/fixtures.log

      # The harness reports a drift as `FAIL: <step>: <inline diff>` on
      # stderr; the logs above are its full diff dump.
      - name: Upload roundtrip diff dump on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roundtrip-dump
          path: |
            roundtrip-dump/
            fuzz-native-test.log
          if-no-files-found: ignore
          retention-days: 7

      # D5.5 (issue #90) / issue #229 — `fuzz/` is its own workspace (its
      # own `[workspace]` in `fuzz/Cargo.toml`) so it's excluded from the
      # `cargo test --workspace` above; without an explicit step here
      # nothing in CI ever compiled or ran it, which is exactly how #229's
      # regression (a stale corpus seed) went undetected. `cargo check`
      # first — the D5.5 compile-only gate — then the fuzz crate's own
      # `cargo test`, in the same job so a fuzz-crate break surfaces
      # alongside the rest of native CI, not in a separate silent lane.
      - name: cargo check fuzz crate
        run: cargo check --manifest-path fuzz/Cargo.toml

      - name: cargo test fuzz crate
        run: cargo test --manifest-path fuzz/Cargo.toml

  wasm:
    name: WASM build + size budget
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          # Pinned: the action's "latest" lookup is not deterministic (the
          # 2026-09-25 QA run received v0.9.1 while the wasm job received
          # v0.15.0 in the same minute; 0.9.1 cannot parse workspace-inherited
          # `package.license`). Keep in step with the Homebrew wasm-pack.
          version: 'v0.15.0'

      - name: Build engine-wasm (release)
        run: wasm-pack build --target web --release crates/engine-wasm

      - name: Enforce WASM size budget (<15 MB)
        run: |
          set -euo pipefail
          WASM_PATH="crates/engine-wasm/pkg/engine_wasm_bg.wasm"
          if [ ! -f "$WASM_PATH" ]; then
              echo "ERROR: $WASM_PATH not produced"
              exit 1
          fi
          SIZE_BYTES=$(wc -c < "$WASM_PATH")
          BUDGET_BYTES=15728640
          echo "WASM size: $SIZE_BYTES bytes ($((SIZE_BYTES / 1024)) KiB)"
          echo "Budget:    $BUDGET_BYTES bytes (15 MiB)"
          if [ "$SIZE_BYTES" -ge "$BUDGET_BYTES" ]; then
              echo "FAIL: WASM artifact exceeds 15 MiB budget"
              exit 1
          fi
          echo "OK: under budget"

      - name: Run WASM tests (headless Chrome)
        run: wasm-pack test --headless --chrome crates/engine-wasm

      # Issue #230 — the `e2e` job below needs this exact build (TS imports
      # `crates/engine-wasm/pkg/engine_wasm.js` by relative path, no npm
      # package indirection) but has no reason to redo a Rust toolchain
      # install + wasm-pack build just to get it. Short retention: the
      # artifact only needs to outlive this one workflow run.
      - name: Upload engine-wasm pkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: engine-wasm-pkg
          path: crates/engine-wasm/pkg
          retention-days: 1

  e2e:
    name: Playwright e2e suite
    needs: wasm
    runs-on: ubuntu-24.04
    # Issue #230 — the suite itself runs in under a minute locally
    # (`workers: 1` — several specs are timing-sensitive, see
    # playwright.config.ts).
    # No Rust toolchain / wasm-pack build in this job (the `wasm` job's
    # artifact is reused below), so the whole job should land well inside
    # this cap; the cap exists to catch a Vite dev-server boot stall, not
    # the suite itself.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Download engine-wasm pkg artifact
        uses: actions/download-artifact@v4
        with:
          name: engine-wasm-pkg
          path: crates/engine-wasm/pkg

      # `channel: 'chrome'` in playwright.config.ts (see tools/visual-diff's
      # own comment on this) means Playwright never downloads a browser —
      # it drives system Google Chrome. GitHub's ubuntu-24.04 runner image
      # ships `google-chrome-stable` already, but that's an image-tool-cache
      # implementation detail, not a contract; install it explicitly so the
      # job doesn't silently start failing if a future runner image drops
      # it. A no-op (just prints the version) on the current image.
      - name: Ensure Google Chrome stable is installed
        run: |
          set -euo pipefail
          if command -v google-chrome-stable >/dev/null 2>&1; then
            google-chrome-stable --version
          else
            wget -q -O /tmp/google-chrome-key.pub https://dl.google.com/linux/linux_signing_key.pub
            sudo gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg /tmp/google-chrome-key.pub
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" \
              | sudo tee /etc/apt/sources.list.d/google-chrome.list >/dev/null
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
          fi

      # Issue #438 - no `version:` input: the action reads the root
      # package.json `packageManager` pin, so CI and local dev run the same
      # pnpm (pnpm-workspace.yaml uses pnpm 11 settings).
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install JS dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        # Root install, not `--dir ts` (see the qa-harness job's comment on
        # this exact trap: the workspace lockfile lives at the repo root).
        run: pnpm install --frozen-lockfile

      # Issue #332 - the TypeScript unit tests (vitest, node environment,
      # fake-indexeddb): event-log scoring / GC / write-confirm, EngineClient
      # trap handling, recoveryNotices, dev-hook gating. Seconds, no browser
      # and no wasm; failing here saves the minute of Playwright below.
      - name: Run TypeScript unit tests
        run: pnpm -r test

      - name: Run Playwright e2e suite
        env:
          CI: 'true'
        run: cd ts && pnpm exec playwright test --reporter=line

      - name: Upload Playwright test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: ts/test-results/
          if-no-files-found: ignore
          retention-days: 7

  qa-harness:
    name: QA harnesses (visual-diff + pdf-validate)
    runs-on: ubuntu-24.04
    # Non-blocking (Phase 5 D5.1/D5.2): golden pixel-reproducibility on the
    # GitHub runner's Chrome is not yet proven, so a mismatch must surface
    # without breaking main. Promote to a required check once verified.
    continue-on-error: true
    # Bound the runtime — visual-diff alone runs in ~1 min on a clean
    # runner, pdf-validate (issue #258) under 15 s more (measured ~9 s
    # locally: 6 tier-a documents, browser export + structural checks),
    # plus (issue #393) the veraPDF install (cached after the first run;
    # ~30 s cold) and the browserless `--native` pass. The 12-min cap
    # catches dev-server boot stalls without letting the whole job burn
    # an hour of runner time. continue-on-error keeps the overall workflow
    # green when the cap fires.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          # Pinned: the action's "latest" lookup is not deterministic (the
          # 2026-09-25 QA run received v0.9.1 while the wasm job received
          # v0.15.0 in the same minute; 0.9.1 cannot parse workspace-inherited
          # `package.license`). Keep in step with the Homebrew wasm-pack.
          version: 'v0.15.0'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Build engine-wasm (release)
        run: wasm-pack build --target web --release crates/engine-wasm

      - name: Install JS dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        # Root install covers every workspace member (packages/*, ts,
        # tools/*) via the workspace lockfile. The sub-dir `--dir ts`
        # pattern from the pre-workspace era now resolves to a stale
        # lockfile with no @nge/* deps — CI fails ERR_PNPM_OUTDATED_LOCKFILE.
        run: pnpm install --frozen-lockfile

      - name: Run visual-diff harness
        run: |
          set -uo pipefail
          pnpm --dir ts dev &
          DEV_PID=$!
          for _ in $(seq 1 60); do
            curl -sf http://localhost:5173 >/dev/null 2>&1 && break
            sleep 1
          done
          # Visual-diff alone runs every push — 7 tier-A cases × ~3 s on
          # the runner ≈ 21 s real, capped at 3 min by `timeout`.
          # `timeout` exits 124 on the cap; `continue-on-error: true`
          # catches it so a flake never breaks main.
          #
          # Memory-profile + perf are excluded from per-push CI: on the
          # shared GitHub runner the 100p/250p/500p `<docs>` consistently
          # blew the 3-min cap (Playwright `page.evaluate` browser-context
          # crash after ~77 s on the 50p fixture alone). Run them locally
          # with `node tools/memory-profile/run.mjs --budgets` /
          # `node tools/perf/run.mjs --strict` or wire a nightly schedule
          # against a dedicated runner.
          timeout 180 node tools/visual-diff/run.mjs --tier A
          VD=$?
          kill "$DEV_PID" 2>/dev/null || true
          echo "visual-diff exit=$VD"
          [ "$VD" -eq 0 ]

      # Issue #393 (resolves the open half of #322) — veraPDF on the runner,
      # so both pdf-validate steps run the REAL PDF/A conformance checks
      # instead of the structural-only fallback. The CLI is the official
      # greenfield installer zip at a pinned version + SHA-256, installed
      # headlessly (IzPack auto-install) into ~/verapdf and cached with
      # actions/cache so only the first run downloads ~33 MB. Java ships on
      # the ubuntu-24.04 image (veraPDF needs 11+).
      - name: Cache veraPDF
        id: verapdf-cache
        uses: actions/cache@v4
        with:
          path: ~/verapdf
          key: verapdf-1.30.2-${{ runner.os }}

      - name: Install veraPDF 1.30.2
        if: steps.verapdf-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          VERA_VERSION=1.30.2
          VERA_SHA256=6cc6341cb1af644044054b81f00a6590a7918abb18f762243de115258bcad838
          WORK="$(mktemp -d)"
          curl -sSfL --retry 3 -o "$WORK/verapdf.zip" \
            "https://software.verapdf.org/releases/1.30/verapdf-greenfield-${VERA_VERSION}-installer.zip"
          echo "${VERA_SHA256}  $WORK/verapdf.zip" | sha256sum -c -
          unzip -q "$WORK/verapdf.zip" -d "$WORK/unz"
          cat > "$WORK/auto-install.xml" <<XML
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <AutomatedInstallation langpack="eng">
            <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
            <com.izforge.izpack.panels.target.TargetPanel id="install_dir">
              <installpath>$HOME/verapdf</installpath>
            </com.izforge.izpack.panels.target.TargetPanel>
            <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select">
              <pack index="0" name="veraPDF Runtime" selected="true"/>
            </com.izforge.izpack.panels.packs.PacksPanel>
            <com.izforge.izpack.panels.install.InstallPanel id="install"/>
            <com.izforge.izpack.panels.finish.FinishPanel id="finish"/>
          </AutomatedInstallation>
          XML
          java -jar "$WORK/unz/verapdf-greenfield-${VERA_VERSION}/verapdf-izpack-installer-${VERA_VERSION}.jar" "$WORK/auto-install.xml"

      - name: Put veraPDF on PATH
        run: |
          set -euo pipefail
          echo "$HOME/verapdf" >> "$GITHUB_PATH"
          "$HOME/verapdf/verapdf" --version

      - name: Run pdf-validate harness
        # Issue #258 — the tier-a corpus (6 documents: TOC leaders, inline
        # images, a bordered/shaded table, justified Arabic Kashida,
        # footnotes + endnotes, a text box) exported through the real
        # engine and checked for the PDF/A-1b structural markers
        # `crates/format-pdf` must emit, then (issue #393) validated by
        # the real veraPDF installed above - `--strict` makes a missing
        # veraPDF a failure instead of a silent skip. The job stays
        # non-blocking regardless (see the job header).
        run: |
          set -uo pipefail
          pnpm --dir ts dev &
          DEV_PID=$!
          for _ in $(seq 1 60); do
            curl -sf http://localhost:5173 >/dev/null 2>&1 && break
            sleep 1
          done
          timeout 60 node tools/pdf-validate/run.mjs --corpus tier-a --profile 1b --strict
          PV=$?
          kill "$DEV_PID" 2>/dev/null || true
          echo "pdf-validate exit=$PV"
          [ "$PV" -eq 0 ]

      # Issue #393 - the browserless `--native` pass (#361): Latin + Arabic
      # fixtures in CFF-flavoured OpenType and TrueType, exported straight
      # from `format-pdf` (no Vite, no Chrome), then the structural, size
      # and veraPDF checks. The test binary is built in its own uncapped
      # step so the 2-minute cap below bounds the run + validation, not a
      # cold compile.
      - name: Build native pdf-validate exporter
        run: cargo test -p format-pdf --lib --no-run

      - name: Run pdf-validate harness (native, no browser)
        run: |
          set -uo pipefail
          timeout 120 node tools/pdf-validate/run.mjs --native --strict
