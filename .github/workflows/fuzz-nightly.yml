name: fuzz-nightly

# D5.5 scaled up (issue #90; the 5th target added by issue #227, the 6th —
# `snapshot_decode` — by issue #341) — nightly
# `cargo +nightly fuzz run` for each structure-aware target in `fuzz/`.
# `ci.yml`'s `rust-native` job only compile-checks `fuzz/` on stable
# (`cargo check --manifest-path fuzz/Cargo.toml`); running the targets for
# real wall-clock time needs the nightly toolchain + libFuzzer sanitizer
# runtime, which is why this lives in its own scheduled workflow rather
# than blocking every PR.
#
# Each matrix leg: restores the corpus cache, runs
# `cargo +nightly fuzz run <target>` for a fixed budget, minimizes any
# crash it finds (`cargo +nightly fuzz tmin`), uploads the crash as a
# workflow artifact, and auto-files a GitHub issue with the (minimized)
# reproducer attached — deduplicated by a content-hash title so a crash
# that reproduces every night doesn't spam a fresh issue each run.
#
# Pass/fail contract (the lane went red every night for weeks because the
# last step failed on ANY crash artifact, and the cache — which only saves
# on a green job — never grew):
#   - no crash found       -> green
#   - crash found          -> green, and an issue is filed (the crash
#                             artifacts + issues are the source of truth,
#                             not the job colour)
#   - infrastructure error -> RED, in the step named "Fail on fuzzer
#     infrastructure error": the fuzzer never started (build / toolchain /
#     startup abort), `gh` could not list or create issues, or a crash's
#     reproducer is a zero-length file (never file a content-free issue).

on:
  schedule:
    # 03:00 UTC daily — off peak, clear of the per-PR `ci.yml` traffic.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      duration_secs:
        description: 'Per-target fuzz budget, in seconds'
        required: false
        default: '1800'
      minimize_budget_secs:
        description: 'Per-job crash-minimization budget, in seconds'
        required: false
        default: '900'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  fuzz:
    name: cargo fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    # 30 min fuzz budget (default) + build + 15 min minimize budget + upload.
    timeout-minutes: 50
    permissions:
      issues: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # `corpus_dir` usually equals `target` — it differs only for
        # `format_pdf_image_decode` (issue #227), whose seeds live under
        # `fuzz/corpus/image_decode/` (issue #208's naming, predating this
        # target — the directory describes the seeds' SUBJECT, not any
        # one target's bin name).
        include:
          - target: docx_reader
            corpus_dir: docx_reader
          - target: docx_roundtrip
            corpus_dir: docx_roundtrip
          - target: rpc_command
            corpus_dir: rpc_command
          - target: layout_paginate
            corpus_dir: layout_paginate
          # Issue #341 — engine::snapshot envelopes through Engine::restore
          # / Command::Recover.
          - target: snapshot_decode
            corpus_dir: snapshot_decode
          - target: format_pdf_image_decode
            corpus_dir: image_decode
    steps:
      - uses: actions/checkout@v6

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # Corpus + artifacts persist and GROW across nightly runs: the cache
      # key includes `github.run_id` (always a fresh miss), so the restore
      # step falls back to `restore-keys` and grabs the most recent past
      # cache, and the post-job save step then writes back whatever new
      # corpus entries this run's fuzzing discovered under the new key.
      # A same-key cache is immutable in GitHub Actions, so a STATIC key
      # here would silently stop growing after the first run.
      - name: Cache fuzz corpus
        uses: actions/cache@v4
        with:
          # The corpus only: crash artifacts must NOT be restored, or a
          # crash filed weeks ago re-triggers every night forever.
          path: fuzz/corpus/${{ matrix.corpus_dir }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: Cargo registry cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
          shared-key: fuzz-${{ matrix.target }}

      - name: Run cargo fuzz
        id: run
        working-directory: fuzz
        # Never fails the step: crashes are read from the artifacts dir and
        # infrastructure errors are classified in the last step. A crashing
        # session legitimately exits non-zero (77) under `-fork`.
        run: |
          set -uo pipefail
          mkdir -p "corpus/${{ matrix.corpus_dir }}"
          rm -rf "artifacts/${{ matrix.target }}"
          mkdir -p "artifacts/${{ matrix.target }}"
          DURATION="${{ github.event.inputs.duration_secs || '1800' }}"
          # `-fork=4`: libFuzzer runs testcases in forked worker processes
          # and restarts a worker that crashes instead of ending the whole
          # session — load-bearing here, not just a speed knob. A known,
          # not-yet-fixed bug reproduces on a large fraction of inputs;
          # without `-fork`, `cargo fuzz run` stops at the FIRST crash of
          # a whole session, so every nightly run would burn its entire
          # budget re-finding the same issue in the first few seconds and
          # never explore anything else. Each worker crash still gets
          # minimized + filed exactly the same way.
          cargo +nightly fuzz run "${{ matrix.target }}" -- \
            "corpus/${{ matrix.corpus_dir }}" \
            -fork=4 \
            -ignore_crashes=1 \
            -ignore_ooms=1 \
            -ignore_timeouts=1 \
            -max_total_time="$DURATION" \
            -rss_limit_mb=4096 \
            -timeout=30 \
            -artifact_prefix="artifacts/${{ matrix.target }}/" \
            2>&1 | tee fuzz-run.log
          # libFuzzer's own exit code, not `tee`'s.
          rc="${PIPESTATUS[0]}"
          echo "libFuzzer exit status: $rc"
          # "INFO: Seed:" is printed by libFuzzer as soon as the harness
          # binary starts. Its absence means the build or the process
          # startup failed — an infrastructure error, not a finding.
          if grep -q '^INFO: Seed:' fuzz-run.log; then
            echo "started=true" >> "$GITHUB_OUTPUT"
          else
            echo "started=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      # Bounded (run 37937811241: one deterministic `rpc_command` hang under
      # `-fork=4` left many `timeout-*` files; the old per-artifact
      # `timeout 600` loop with no overall bound sat for ~40 min until the
      # job timeout killed it — red, the wrong classification for a finding).
      # Bounds: a per-job budget (MINIMIZE_BUDGET_SECS, default 900),
      # per-artifact `timeout` <= 180 s with `-max_total_time=120`, and the
      # order crash -> leak -> oom; `timeout-*` artifacts are never tmin'd
      # (copied straight to `.min`). Once the budget is spent the remaining artifacts get
      # `.min = original`: never lost, never minimized. Straight-line code,
      # one `cp` fallback — nothing here can loop on its own output.
      - name: Minimize any crash artifact
        if: always()
        working-directory: fuzz
        env:
          MINIMIZE_BUDGET_INPUT: ${{ github.event.inputs.minimize_budget_secs }}
        run: |
          set -uo pipefail
          shopt -s nullglob
          BUDGET="${MINIMIZE_BUDGET_INPUT:-900}"
          case "$BUDGET" in ''|*[!0-9]*) BUDGET=900 ;; esac
          START="$SECONDS"
          DIR="artifacts/${{ matrix.target }}"
          # Hangs are not minimizable in practice: tmin runs every execution
          # to the 30 s timeout and (run 37937811241) ran each of the four
          # artifacts to its outer kill without output. Skip it: .min = original.
          for f in "$DIR"/timeout-*; do
            [ -f "$f" ] || continue
            case "$f" in *.min) continue ;; esac
            cp "$f" "$f.min"
          done
          for kind in crash leak oom; do
            for f in "$DIR"/"$kind"-*; do
              [ -f "$f" ] || continue
              case "$f" in *.min) continue ;; esac
              rm -f "$f.min"
              REMAINING=$(( BUDGET - (SECONDS - START) ))
              if [ "$REMAINING" -lt 20 ]; then
                echo "Minimize budget (${BUDGET}s) exhausted; keeping $f ($(stat -c %s "$f") bytes) un-minimized"
                cp "$f" "$f.min"
                continue
              fi
              LIMIT=180
              [ "$REMAINING" -lt "$LIMIT" ] && LIMIT="$REMAINING"
              MAXT=120
              [ "$LIMIT" -le 130 ] && MAXT=$(( LIMIT - 10 ))
              echo "Minimizing $f ($(stat -c %s "$f") bytes; ${REMAINING}s of budget left, limit ${LIMIT}s)"
              # cargo-fuzz has no `-o`; libFuzzer's `-exact_artifact_path`
              # is where tmin writes the smallest still-crashing input.
              timeout -k 10 "$LIMIT" cargo +nightly fuzz tmin "${{ matrix.target }}" "$f" -- \
                -max_total_time="$MAXT" -timeout=30 -exact_artifact_path="$f.min" || true
              # tmin can fail, time out, or emit an empty file: fall back to
              # the un-minimized input so the reproducer is never lost.
              if [ ! -s "$f.min" ]; then
                echo "tmin produced no usable output for $f; using the original input"
                cp "$f" "$f.min"
              fi
            done
          done
          echo "Minimization used $(( SECONDS - START ))s of the ${BUDGET}s budget."

      - name: Upload crash artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.target }}-${{ github.run_id }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 90

      # Bounded filing: at most MAX_ISSUES (3) NEW issues per target per run,
      # in the order crash -> leak -> oom -> timeout. All timeout artifacts of
      # a target share one hang signature in practice, so they are ONE issue
      # (every reproducer in the body, <= 4 KB each; larger ones referenced
      # by artifact name), deduped against OPEN `fuzz(<target>): timeout ...`
      # issues by the sha256 of the smallest reproducer. Whatever does not fit
      # is listed (name, size, sha256) in the last filed issue's body and
      # stays in the uploaded artifact.
      - name: File a GitHub issue per new crash
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: fuzz
        run: |
          set -uo pipefail
          shopt -s nullglob
          : > infra-errors.txt
          TARGET="${{ matrix.target }}"
          DIR="artifacts/$TARGET"
          MAX_ISSUES=3
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TAB=$'\t'

          if ! EXISTING="$(gh issue list --state all --limit 2000 --json state,title --jq '.[] | .state + "\t" + .title')"; then
            echo "::error::could not list existing issues"
            echo "gh issue list failed" >> infra-errors.txt
            exit 0
          fi
          # Exact-title match: GitHub's search tokenizer is not a reliable
          # oracle for titles with parens and colons. The title carries the
          # TARGET name, so equal hashes in two targets never collide.
          filed_any() { grep -qxF "OPEN${TAB}$1" <<<"$EXISTING" || grep -qxF "CLOSED${TAB}$1" <<<"$EXISTING"; }
          filed_open() { grep -qxF "OPEN${TAB}$1" <<<"$EXISTING"; }
          describe() { echo "- \`$(basename "$1")\` ($(stat -c %s "$1") bytes) sha256 \`$(sha256sum "$1" | cut -d' ' -f1)\`"; }

          # Pass 1: collect new units (one per crash/leak/oom file, one for
          # all timeouts), in priority order. Dedup before counting, so a
          # known crash never consumes a slot.
          UNIT_KIND=(); UNIT_TITLE=(); UNIT_FILES=()
          for kind in crash leak oom; do
            for f in "$DIR"/"$kind"-*.min; do
              [ -f "$f" ] || continue
              if [ ! -s "$f" ]; then
                # Content-free (the empty-input crash behind #323 / #324 was
                # a per-iteration leak reported against the empty unit).
                echo "::error::zero-length reproducer $f for $TARGET; not filing an issue"
                echo "zero-length reproducer: $f" >> infra-errors.txt
                continue
              fi
              TITLE="fuzz($TARGET): crash $(sha256sum "$f" | cut -c1-12)"
              if filed_any "$TITLE"; then echo "Already filed: $TITLE"; continue; fi
              UNIT_KIND+=(crash); UNIT_TITLE+=("$TITLE"); UNIT_FILES+=("$f")
            done
          done
          TFILES=()
          for f in "$DIR"/timeout-*.min; do
            [ -f "$f" ] || continue
            if [ ! -s "$f" ]; then
              echo "::error::zero-length reproducer $f for $TARGET; not filing an issue"
              echo "zero-length reproducer: $f" >> infra-errors.txt
              continue
            fi
            TFILES+=("$f")
          done
          if [ ${#TFILES[@]} -gt 0 ]; then
            # Smallest first (ties by name) -> its hash names the issue.
            mapfile -t TFILES < <(for f in "${TFILES[@]}"; do echo "$(stat -c %s "$f") $f"; done | sort -n -k1,1 -k2,2 | cut -d' ' -f2-)
            TITLE="fuzz($TARGET): timeout $(sha256sum "${TFILES[0]}" | cut -c1-12)"
            if filed_open "$TITLE"; then
              echo "Already filed (open): $TITLE"
            else
              UNIT_KIND+=(timeout); UNIT_TITLE+=("$TITLE"); UNIT_FILES+=("${TFILES[*]}")
            fi
          fi

          N=${#UNIT_TITLE[@]}
          TO_FILE=$(( N < MAX_ISSUES ? N : MAX_ISSUES ))
          echo "$N new finding(s) for $TARGET; filing $TO_FILE (cap $MAX_ISSUES)."

          # Pass 2: file the first TO_FILE units; the last one also lists
          # every unit that did not fit.
          for (( i = 0; i < TO_FILE; i++ )); do
            kind="${UNIT_KIND[$i]}"
            TITLE="${UNIT_TITLE[$i]}"
            read -r -a FILES <<<"${UNIT_FILES[$i]}"
            BODY_FILE="$(mktemp)"
            {
              if [ "$kind" = timeout ]; then
                echo "Nightly structure-aware fuzzing found a hang (D5.5, issue #90): ${#FILES[@]} libFuzzer \`timeout-*\` reproducer(s), which in practice share one hang signature, so they are filed as a single issue."
              else
                echo "Nightly structure-aware fuzzing found a crash (D5.5, issue #90)."
              fi
              echo
              echo "- Target: \`$TARGET\`"
              echo "- Workflow run: $RUN_URL"
              echo "- Every original and minimized input is in the run's uploaded \`fuzz-crashes-$TARGET-${{ github.run_id }}\` artifact."
              echo
              if [ "$kind" = timeout ]; then
                echo "### Reproducers (smallest first; base64 when <= 4 KB, else see the artifact)"
                USED=0
                for f in "${FILES[@]}"; do
                  SZ="$(stat -c %s "$f")"
                  echo
                  describe "$f"
                  if [ "$SZ" -le 4096 ] && [ "$USED" -lt 40000 ]; then
                    B64="$(base64 -w0 "$f")"
                    USED=$(( USED + ${#B64} ))
                    echo '```'
                    echo "$B64"
                    echo '```'
                  else
                    echo "  (not inlined; see the artifact)"
                  fi
                done
                echo
                echo "### Reproduce locally"
                echo
                echo '```'
                echo "cd fuzz"
                echo "base64 -d > repro.bin <<< '<one of the base64 blobs above>'"
                echo "cargo +nightly fuzz run $TARGET repro.bin -- -timeout=60"
                echo '```'
              else
                f="${FILES[0]}"
                echo "- Reproducer: \`$(basename "$f")\` ($(stat -c %s "$f") bytes; attached below and in the run's uploaded artifact)"
                echo
                echo "### Reproducer (base64)"
                echo
                echo '```'
                base64 -w0 "$f"
                echo
                echo '```'
                echo
                echo "### Reproduce locally"
                echo
                echo '```'
                echo "cd fuzz"
                echo "base64 -d > repro.bin <<< '$(base64 -w0 "$f")'"
                echo "cargo +nightly fuzz run $TARGET repro.bin"
                echo '```'
              fi
              if [ "$i" -eq $(( TO_FILE - 1 )) ] && [ "$N" -gt "$TO_FILE" ]; then
                echo
                echo "### Further findings this run (not filed: per-run cap of $MAX_ISSUES issues per target)"
                echo
                echo "These stay in the uploaded artifact; they will be filed by a later run if they recur."
                echo
                for (( j = TO_FILE; j < N; j++ )); do
                  read -r -a RFILES <<<"${UNIT_FILES[$j]}"
                  for f in "${RFILES[@]}"; do describe "$f"; done
                done | head -n 200
              fi
            } > "$BODY_FILE"
            if gh issue create \
              --title "$TITLE" \
              --label tech-debt \
              --label core-engine \
              --body-file "$BODY_FILE"; then
              EXISTING="$EXISTING"$'\n'"OPEN${TAB}$TITLE"
            else
              echo "::error::gh issue create failed for $TITLE"
              echo "gh issue create failed: $TITLE" >> infra-errors.txt
            fi
          done

      - name: Fail on fuzzer infrastructure error
        if: always()
        working-directory: fuzz
        run: |
          shopt -s nullglob
          files=(artifacts/${{ matrix.target }}/crash-* artifacts/${{ matrix.target }}/leak-* artifacts/${{ matrix.target }}/oom-* artifacts/${{ matrix.target }}/timeout-*)
          if [ ${#files[@]} -gt 0 ]; then
            echo "${#files[@]} crash artifact(s) for ${{ matrix.target }} — filed/deduplicated as issues above; this is a finding, not a job failure."
          else
            echo "No crashes for ${{ matrix.target }}."
          fi
          status=0
          if [ "${{ steps.run.outputs.started }}" != "true" ]; then
            echo "::error::the ${{ matrix.target }} fuzzer never started (build or startup failure) — see the 'Run cargo fuzz' step log"
            status=1
          fi
          if [ -s infra-errors.txt ]; then
            echo "::error::issue-filing / reproducer problems:"
            cat infra-errors.txt
            status=1
          fi
          exit "$status"
