[workspace]
members = [
    "crates/bridge",
    "crates/engine",
    "crates/engine-wasm",
    "crates/text-pipeline",
    "crates/layout",
    "crates/render",
    "crates/format-docx",
    "crates/format-html",
    "crates/format-pdf",
    "tools/shape-regression",
    "tools/roundtrip",
    "tools/perf-fixtures",
    "tools/differential-native",
    "tools/corpus-native",
]
resolver = "2"

[workspace.package]
version = "0.5.0-beta.3"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/IbraheemAlz/next-gen-editor"

[workspace.dependencies]
# Bridge / FFI
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "DedicatedWorkerGlobalScope", "WorkerGlobalScope", "MessagePort", "MessageEvent",
    "OffscreenCanvas", "OffscreenCanvasRenderingContext2d",
    "ImageBitmap", "ImageData", "console", "Performance",
] }
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
# Snapshot codec (issue #85) — self-describing MessagePack so `#[serde(default)]`
# fills fields an older snapshot version lacks.
rmp-serde = "1"
# Dev-only: JSON round-trip tests assert the `#[serde(tag = "type", ...)]`
# wire shape of bridge enums (Issue #86 telemetry.rs tests).
serde_json = "1"
serde-wasm-bindgen = "0.6"
tsify-next = { version = "0.5", default-features = false, features = ["js"] }

# Text / Unicode
icu = "1.5"
unicode-bidi = "0.3"
icu_segmenter = "2.2"
icu_normalizer = "2.2"
icu_properties = "2.2"
icu_locale = "1.5"
unicode-segmentation = "1.12"
rustybuzz = "0.20"
swash = "0.2"
read-fonts = "0.27"

# Rendering (Phase 3)
kurbo = "0.13.1"
peniko = "0.6.1"

# Structures
im = "15"
smallvec = "1"
indexmap = "2"
lru = "0.12"

# Codecs
quick-xml = "0.36"
rc-zip = "5"
zip = { version = "2", default-features = false, features = ["deflate"] }
pdf-writer = "0.14"
# flate2 default features select the pure-Rust `miniz_oxide` backend — no C,
# wasm-safe. PDF `/FlateDecode` streams are zlib (RFC 1950), which flate2's
# `ZlibEncoder` produces directly.
flate2 = "1"
# Issue #121 — PNG decode for PDF image XObjects. Pure Rust (MIT OR
# Apache-2.0), already in the wasm graph via `vello`, so no new crates.
png = "0.18"
# Issue #189 — GIF (first frame) and WebP (lossy + lossless) decode for PDF
# image XObjects. Both pure Rust, MIT OR Apache-2.0, no `std::fs` / threads.
# `gif` without its default `color_quant` (encoder-side quantizer only).
# Consumed only by `format-pdf` behind its `gif` / `webp` features.
gif = { version = "0.14", default-features = false, features = ["std"] }
image-webp = "0.2"
# Issue #207 — TIFF decode for PDF image XObjects (BMP is a small
# hand-written decoder in `format-pdf::image`, no crate). Pure Rust (MIT),
# pulling in `jpeg-decoder` (default-features off, so its `rayon` feature —
# threads, unavailable on wasm32-unknown-unknown — never activates),
# `flate2` and `weezl` (both already workspace deps) plus tiny
# `crc32fast`/`cfg-if`/`simd-adler32`/`adler2` (MIT/Apache-2.0/0BSD).
# Probed wasm32 cost (see crates/format-pdf/src/image.rs's module doc):
# ≈ +214 KB raw / +73 KB gzip upper bound, well under the ~150 KB gzip
# threshold for defaulting it on. Pinned to 0.9 (not the newer 0.11, which
# pulls in `zune-jpeg` + CCITT `fax` + `zerocopy` for a materially larger
# footprint we don't need). Consumed only by `format-pdf` behind its `tiff`
# feature.
tiff = "0.9"

# Errors / logging
thiserror = "1"
anyhow = "1"
tracing = "0.1"

# Fuzzing (D5.5, issue #90) — `arbitrary` is an OPTIONAL, feature-gated dep
# of `bridge` (see crates/bridge/Cargo.toml's `arbitrary` feature). Off by
# default: never activated by the wasm build, zero cost to the production
# artifact. `fuzz/` (its own cargo workspace) turns the feature on to derive
# `Arbitrary` for `Command` and drive structure-aware command sequences.
arbitrary = "1"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package.engine-wasm]
opt-level = "z"
