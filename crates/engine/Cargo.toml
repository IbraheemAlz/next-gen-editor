[package]
name = "engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Pure-Rust document model + undo/redo facade."

[dependencies]
im = { workspace = true, features = ["serde"] }
# Issue #85 — crash-recovery snapshots: the whole document model derives
# serde so `snapshot::encode` / `decode` can persist it.
serde = { workspace = true }
serde_bytes = { workspace = true }
rmp-serde = { workspace = true }
# Issue #269 — SHA-256 content keys for the detached source package and
# the snapshot media references (`package::package_key`, `MediaRef`).
sha2 = { workspace = true }
unicode-segmentation = { workspace = true }
# Sprint 11 (#17) — UAX-#29 word segmentation for `word_count`.
# `WordSegmenter::new_auto` is the same constructor `text-pipeline` already
# uses for `LineSegmenter`, so the compiled-in data tables are shared
# (no incremental wasm bloat beyond the workspace's existing icu surface).
icu_segmenter = { workspace = true }

[features]
# Issue #250 — test-only debug assertion: every committed mutation
# (`UndoStack::push`) and every remapped edit must find each paragraph's
# `source_markup` in step with its text (or explicitly stale). Always on in
# this crate's own unit tests (`cfg(test)`); downstream crates enable it
# from `[dev-dependencies]` so their tests run the check too. Never enabled
# in a production / wasm build.
markup-assert = []
