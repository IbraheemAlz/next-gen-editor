[package]
name = "engine-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "wasm-bindgen surface for the engine. Built via wasm-pack."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bridge = { path = "../bridge" }
engine = { path = "../engine" }
text-pipeline = { path = "../text-pipeline" }
layout = { path = "../layout" }
render = { path = "../render" }
format-docx = { path = "../format-docx" }
format-html = { path = "../format-html" }
format-pdf = { path = "../format-pdf" }
kurbo = { workspace = true }
lru = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true }
serde-wasm-bindgen = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_bytes = { workspace = true }
console_error_panic_hook = { workspace = true }
unicode-segmentation = { workspace = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"
# Issue #250 — run the engine's source-markup-in-step assertion on every
# `UndoStack::push` this crate's tests commit (dev-only; never in the
# wasm artifact).
engine = { path = "../engine", features = ["markup-assert"] }

[features]
# Native testing/fuzzing entry points (D5.5, issue #90) — off by default,
# never activated by `wasm-pack build`. See the `#[cfg(feature =
# "fuzz-native")] impl Engine` block near the end of `src/lib.rs` for what
# it adds: a canvas-less `Engine::new_headless`, a JsValue-free
# `Engine::apply_sync`, and a few invariant accessors the fuzz crate
# (`fuzz/fuzz_targets/rpc_command.rs`, `layout_paginate.rs`) drives.
fuzz-native = []
