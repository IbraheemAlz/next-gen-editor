[package]
name = "format-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "PDF export — box tree to PDF content streams with full font embedding."

[dependencies]
engine = { path = "../engine" }
layout = { path = "../layout" }
text-pipeline = { path = "../text-pipeline" }
pdf-writer = { workspace = true }
flate2 = { workspace = true }
png = { workspace = true }
gif = { workspace = true, optional = true }
image-webp = { workspace = true, optional = true }

[features]
# Issue #189 — pure-Rust GIF / WebP decoders for PDF image XObjects. On by
# default; drop either (`default-features = false`) if the 15 MiB compressed
# wasm budget is ever threatened — the format then degrades to the typed
# `UnsupportedFormat` skip warning it had before.
default = ["gif", "webp"]
gif = ["dep:gif"]
webp = ["dep:image-webp"]
