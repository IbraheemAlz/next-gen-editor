# Fuzz harness — Phase 5 D5.5, scaled up by issue #90.
#
# Its own workspace (`[workspace]` below) so the pinned-toolchain
# `cargo check --workspace` / `cargo test --workspace` at the repo root never
# pull it in — running the targets needs the nightly `cargo fuzz` flow.
#
# Build check (stable, no sanitizers): cargo check --manifest-path fuzz/Cargo.toml
# Run (nightly, see .github/workflows/fuzz-nightly.yml):
#   cargo +nightly fuzz run <target> -- -max_total_time=1800
#
# Five structure-aware targets (`src/lib.rs` holds the generators + the
# `run_*` bodies each `fuzz_targets/*.rs` wraps in a `fuzz_target!`):
#   - docx_reader:      schema-shaped WML in a minimal OPC package -> read_docx
#   - docx_roundtrip:   read -> write -> read must be stable, never panic
#   - rpc_command:      structure-aware Command sequences driven end to end
#                       through the real Engine::apply dispatcher incl. layout
#   - layout_paginate:  random paragraph/table/section trees straight into
#                       the paginator, with a page-count bound as the
#                       termination watchdog
#   - format_pdf_image_decode (issue #227): raw bytes -> format_pdf::
#                       prepare_image for every enabled decoder (PNG/JPEG/
#                       GIF/WebP/BMP/TIFF, sniffing decides); asserts the
#                       typed-skip contract (no panic, bounded allocation,
#                       a successful decode is XObject-ready)
#
# `examples/smoke.rs` is a stable-only driver (no libFuzzer/nightly needed)
# that feeds deterministic pseudo-random inputs + the committed `corpus/`
# seeds through each `run_*` function and asserts no panic — see issue #90
# binding rule 6. Run it with:
#   cargo run --manifest-path fuzz/Cargo.toml --example smoke
#
# `examples/regen-seeds.rs` (issue #229) rewrites the `rpc_command`
# corpus's #186/#187 regression seeds from `command_gen::Scenario`'s
# explicit builder — run after touching that decoding contract:
#   cargo run --manifest-path fuzz/Cargo.toml --example regen-seeds
[package]
name = "engine-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[lib]
name = "engine_fuzz"
path = "src/lib.rs"

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
format-docx = { path = "../crates/format-docx" }
format-pdf = { path = "../crates/format-pdf" }
bridge = { path = "../crates/bridge", features = ["arbitrary"] }
engine = { path = "../crates/engine" }
engine-wasm = { path = "../crates/engine-wasm", features = ["fuzz-native"] }
layout = { path = "../crates/layout" }
render = { path = "../crates/render" }
zip = { version = "2", default-features = false, features = ["deflate"] }

[[bin]]
name = "docx_reader"
path = "fuzz_targets/docx_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "docx_roundtrip"
path = "fuzz_targets/docx_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rpc_command"
path = "fuzz_targets/rpc_command.rs"
test = false
doc = false
bench = false

[[bin]]
name = "layout_paginate"
path = "fuzz_targets/layout_paginate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "format_pdf_image_decode"
path = "fuzz_targets/format_pdf_image_decode.rs"
test = false
doc = false
bench = false

[[example]]
name = "smoke"
path = "examples/smoke.rs"

[[example]]
name = "regen-seeds"
path = "examples/regen-seeds.rs"

[profile.release]
# Keep symbols so libFuzzer can symbolize crashes.
debug = 1
