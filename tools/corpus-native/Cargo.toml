[package]
name = "corpus-native"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Real-document corpus harness (issue #88) — native open -> layout -> PDF render -> save -> reopen driver over a directory of wild .docx files. Never touches a browser; exercises crates/engine + crates/layout + crates/format-docx + crates/format-pdf directly, plus the production engine-wasm layout through its native fuzz-native surface (issue #318)."

[[bin]]
name = "corpus-native"
path = "src/main.rs"

[dependencies]
engine = { path = "../../crates/engine" }
format-docx = { path = "../../crates/format-docx" }
layout = { path = "../../crates/layout" }
text-pipeline = { path = "../../crates/text-pipeline" }
harness-fonts = { path = "../harness-fonts" }
format-pdf = { path = "../../crates/format-pdf" }
# Issue #318 — the production layout (`Engine::build_pages`, real table
# grid + autofit, headers/footers, notes) driven natively through the
# canvas-less `fuzz-native` surface, timed per document under a budget.
engine-wasm = { path = "../../crates/engine-wasm", features = ["fuzz-native"] }
# Issue #418 - `getrusage` for the CPU-time layout budget.
libc = "0.2"
serde = { workspace = true }
serde_json = "1"
anyhow = { workspace = true }
zip = { workspace = true }
quick-xml = { workspace = true }
